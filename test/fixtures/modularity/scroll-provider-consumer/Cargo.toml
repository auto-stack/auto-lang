# PLAN-794 外部 scroll host provider 消费方探针（独立 fixture crate）
#
# 角色：模拟"外部 crate"——仅依赖 auto-lang 的公开面
# （ScrollHostProvider/ScrollAxisDto/ScrollIntentDto/ScrollSnapshotDto/
# ScrollAnchorStateDto + AutoVM/NativeInterface 公开 API + run_with_capture
# + 八 shim），**不启用任何 UI feature**（default-features = false），证明
# scroll controller/子锚点 9900..9905+9922/9923 的 core 供值链在无 UI
# 类型/无 ui::scroll 直引下真实工作：fake provider 实值经 VM 内建到达
# stdout（可区分 Unicode 句柄/键/快照/状态），intent 收精确参数，两实例
# 不串线，缺席=T-01 冻结降级臂逐字面值（Int 0/false/0.0/
# "error:unsupported"/"unknown"）。
#
# 显式脱离根 workspace：本目录不在根 members 内，且此处空 [workspace] 表
# 使其成为独立解析单元（根 Cargo.toml 的 exclude 为双保险）。门禁入口：
#   cargo test --manifest-path test/fixtures/modularity/scroll-provider-consumer/Cargo.toml

[package]
name = "scroll-provider-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
auto-lang = { path = "../../../../crates/auto-lang", default-features = false }
# NanoValue 解码值类型（auto_val::is_string/decode_bool 等）——与 auto-lang
# 同源 path 依赖，单一版本。
auto-val = { path = "../../../../crates/auto-val" }

# 独立 workspace（见上）；无锁文件、无成员。
[workspace]
