# PLAN-800 外部解析核心消费方探针（独立 fixture crate）
#
# 角色：模拟"外部 crate"——仅依赖 auto-package-resolver 的公开面
# （PackageResolverCore/DependencyEntry/PackagePathNotFound），证明
# 依赖视图/包路径候选/依赖内模块判定核心可被无 auto-lang/auto-man/
# auto-gen/auto-ui/auto-vm/auto-val/auto-ast 的外部 consumer 编译并
# 运行：fresh manifest 真实 resolve/歧义/缺项、mode 标签不透明、同名
# 替换立即可见（AC-01/V01）。
#
# 闭包证明 = 本 manifest 的依赖表 + verify-deps.sh（cargo tree 断言
# normal/build 闭包无 auto-lang/auto-man/auto-gen/auto-ui/auto-vm/
# auto-val/auto-ast）。
#
# 显式脱离根 workspace：本目录在根 Cargo.toml exclude 内，且此处空
# [workspace] 表使其成为独立解析单元。门禁入口：
#   cargo test --manifest-path test/fixtures/modularity/package-resolver-consumer/Cargo.toml
# 依赖闭包断言（V01 oracle）：
#   bash test/fixtures/modularity/package-resolver-consumer/verify-deps.sh

[package]
name = "package-resolver-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
auto-package-resolver = { path = "../../../../crates/auto-package-resolver" }

# 独立 workspace（见上）；无锁文件、无成员。测试用 std::env::temp_dir
# + pid 构造真实普通目录（不创建 junction/symlink）。
[workspace]
