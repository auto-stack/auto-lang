# PLAN-803 外部资源层消费方探针（独立 fixture crate）
#
# 角色：模拟"外部 crate"——仅依赖 auto-man-assets 的公开面
# （TemplateAssets/GhsAssets/IarAssets/plan_template_family/PlannedFile），
# 证明 Man 三组资源与纯脚手架路径规划可被无 auto-lang/auto-man/
# auto-gen/auto-ui/auto-vm/auto-val/auto-ast 的外部 consumer 编译并
# 运行：全量枚举/字节读取、按族+包名路径计划、未知族空结果、内容
# 未渲染（AC-01/V01）。
#
# 闭包证明 = 本 manifest 的依赖表 + verify-deps.sh（cargo tree 断言
# normal/build 闭包无 auto-lang/auto-man/auto-gen/auto-ui/auto-vm/
# auto-val/auto-ast）。
#
# 构建模式边界（F803-R1-03）：默认调试态 rust-embed 动态读源码资源
# 目录、发行态内嵌；可重复反控 mode-boundary-probe.py（缺资源真失败）。
#
# 显式脱离根 workspace：本目录在根 Cargo.toml exclude 内，且此处空
# [workspace] 表使其成为独立解析单元。门禁入口：
#   cargo test --manifest-path test/fixtures/modularity/man-assets-consumer/Cargo.toml
# 依赖闭包断言（V01 oracle）：
#   bash test/fixtures/modularity/man-assets-consumer/verify-deps.sh

[package]
name = "man-assets-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
auto-man-assets = { path = "../../../../crates/auto-man-assets" }

# 独立 workspace（见上）；无锁文件、无成员。
[workspace]
