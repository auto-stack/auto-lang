# PLAN-831 T-03 冻结：旧 auto_lang 兼容面 + C2 声明单源 touchpoint 锚点表。
#
# 用途：type driver（driver.py type）按本表做结构性钉住（锚点在位性），
# 并由本表派生编译探针（--compile-probe，T-05 起以真实源执行）。
# 锚点均为 2026-10-24 实测源事实（lang-831 树 @2dafba909 基线）；
# 若上游重构移动了符号，更新本表并按 migration-phases.json 的
# interface_change_protocol 在 Plan 831 记录具名修订。
#
# 结构：
#   [[compat_face]]     旧 auto_lang 公开面锚点（V-02「旧 Parser/VM 公开构造、
#                       pub 字段/回调、default/显式 feature」）。anchor 给出
#                       crate 内相对文件与必须包含的源文本（词边界匹配）。
#                       probe 是编译探针使用的完整 use 路径。
#   [[declaration_home]] C2 声明符号的单源约束：symbol 必须恰好存在于
#                       homes 列出的 crate 之一（lib.rs 公开导出），双在场=复制红，
#                       缺席=红（T-05 切移时表会随记录修订）。
#   [[import_face]]     声明消费方的导入面：文件内 phase 期望的声明源 token。

