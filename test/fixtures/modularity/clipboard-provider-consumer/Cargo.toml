# PLAN-785 外部 clipboard text provider 消费方探针（独立 fixture crate）
#
# 角色：模拟"外部 crate"——仅依赖 auto-lang 的公开面
# （ClipboardTextProvider + AutoVM/NativeInterface/Codegen/Linker 公开 API
# + run_with_capture），**不启用任何 UI feature**（default-features =
# false），证明文本剪贴板 2925/2926 的 core 供值链在无 UI 类型/无
# arboard 直引下真实工作：外部 provider 实值经 VM 内建到达 stdout，
# set 收到精确 UTF-8 参数，两实例不串线，缺席=原 feature-disabled 错误。
#
# 显式脱离根 workspace：本目录不在根 members 内，且此处空 [workspace] 表
# 使其成为独立解析单元（根 Cargo.toml 的 exclude 为双保险）。门禁入口：
#   cargo test --manifest-path test/fixtures/modularity/clipboard-provider-consumer/Cargo.toml
# UI 开启形态复跑（V-03/V-04 兼容安装优先矩阵；计划 §6）：
#   cargo test --manifest-path <本manifest> --features ui-host
# ——两形态下本套测试必须同绿（显式默认不被兼容安装覆盖；缺席错误仅
# 在无任何装配的 no-ui 形态出现）。红线（计划 §5）：任何测试不得经真实
# arboard adapter 写用户剪贴板——补缺断言只走读侧。

[package]
name = "clipboard-provider-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# passthrough：UI 宿主形态。取 `ui-iced` 超集（含 ui + ui-clipboard）——
# T01 矩阵实测：{ui} / {ui, ui-clipboard} 单开在当前 master 预存不可建
#（ui::iced/session/dynamic 缺失，与本计划无关），可建 UI 形态只有
# ui-iced 全家桶（=日常 default 同源面）。测试以 `#[cfg(feature =
# "ui-host")]` 分臂两构建的期望差。
ui-host = ["auto-lang/ui-iced"]

[dependencies]
auto-lang = { path = "../../../../crates/auto-lang", default-features = false }
auto-lang-core = { path = "../../../../crates/auto-lang-core" }
# 仅用于类型名 auto_val::ValueKey（object_keys 元数据形）——与 auto-lang
# 同源 path 依赖，单一版本。
auto-val = { path = "../../../../crates/auto-val" }

# 独立 workspace（见上）；无锁文件、无成员。
[workspace]
