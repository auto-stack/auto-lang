# PLAN-804 外部 dialog/dnd host provider 消费方探针（独立 fixture crate）
#
# 角色：模拟"外部 crate"——仅依赖 auto-lang 的公开面
# （DialogHostProvider/DndHostProvider + AutoVM/NativeInterface 公开 API +
# run_with_capture + 三 shim 2927/2928/2938），**不启用任何 UI feature**
# （default-features = false），证明对话框与拖出 core 供值链在无 UI 类型/
# 无 rfd/renderer/COM 直引下真实工作：fake provider 实值（互异 Unicode
# filter/default/JSON）经 VM 内建到达 stdout，参数精确 raw 到达，取消=
# 空串，缺席=dialog feature-disabled 形 Err 文本逐字 / dnd false（T-01
# 冻结矩阵），两槽独立、两实例不串线。
#
# 显式脱离根 workspace：本目录不在根 members 内，且此处空 [workspace] 表
# 使其成为独立解析单元（根 Cargo.toml 的 exclude 为双保险）。门禁入口：
#   cargo test --manifest-path test/fixtures/modularity/dialog-dnd-provider-consumer/Cargo.toml

[package]
name = "dialog-dnd-provider-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
auto-lang = { path = "../../../../crates/auto-lang", default-features = false }
# 仅用于类型名 auto_val::ValueKey（object_keys 元数据形）——与 auto-lang
# 同源 path 依赖，单一版本（779 fixture 同款）。
auto-val = { path = "../../../../crates/auto-val" }

# V-04 ui-dialog-only 高层入口实机档（PLAN-804）：passthrough 开
# auto-lang 的 ui-dialog（不启 ui）——run_with_capture 高层路径在无 ui
# renderer 门下恢复对话框接线；测试 env 门控 AUTO_LANG_DIALOG_E2E=1 才
# 弹真模态（见 tests/dialog_dnd_vm.rs 文件头）。
[features]
ui-dialog-host = ["auto-lang/ui-dialog"]

# 独立 workspace（见上）；无锁文件、无成员。
[workspace]
