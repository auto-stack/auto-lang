# PLAN-802 外部 code editor host provider 消费方探针（独立 fixture crate）
#
# 角色：模拟"外部 crate"——仅依赖 auto-lang 的公开面
#（CodeEditorHostProvider/CodeEditorCursorDto/CodeEditorScrollOffsetDto +
# AutoVM/NativeInterface 公开 API + run_with_capture + 22 shim），**不启用
# 任何 UI feature**（default-features = false），证明 code_editor 22 native
# 全族（2910..2915、2919..2924、2932/2933、2939、9906、9908..9913）的
# core 供值链在无 UI 类型/无 ui::code_editor 直引下真实工作：fake provider
# 实值经 VM 内建到达 stdout（可区分 Unicode 键/文本/delta JSON），操作收
# 精确参数，两实例不串线，缺席=T-01 冻结缺席臂逐字面值（21 项 raise
# feature-disabled 形、9913 scroll_to 弹参返 false）。
#
# 显式脱离根 workspace：本目录不在根 members 内，且此处空 [workspace] 表
# 使其成为独立解析单元（根 Cargo.toml 的 exclude 为双保险）。门禁入口：
#   cargo test --manifest-path test/fixtures/modularity/code-editor-provider-consumer/Cargo.toml

[package]
name = "code-editor-provider-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
auto-lang = { path = "../../../../crates/auto-lang", default-features = false }
# NanoValue 解码值类型（auto_val::is_string/decode_bool 等）——与 auto-lang
# 同源 path 依赖，单一版本。
auto-val = { path = "../../../../crates/auto-val" }

# 独立 workspace（见上）；无锁文件、无成员。
[workspace]
