# PLAN-815 T-12 UI 工具消费方探针（独立 fixture crate）
#
# 角色：模拟"外部 crate / 外部执行器"——
#  (1) 仅依赖 auto-ui-tools + auto-tool-protocol + auto-project-model，
#      证明 M815-A 工具闭包无 auto-man/auto-lang/auto-vm/auto-gen/解释器栈
#      （AC-01/V-01 A 范围；闭包断言 = verify-deps.sh cargo tree）；
#  (2) 以真实子进程消费 auto-ui-tool 二进制（V-05：describe/validate、
#      版本/能力拒绝零副作用、控制流不被日志污染）。
#
# 显式脱离根 workspace：根 Cargo.toml exclude 内，且此处空 [workspace] 表
# 使其成为独立解析单元。门禁入口（二进制先构建再测试）：
#   cargo build -p auto-ui-tools
#   AUTO_UI_TOOL_BIN=<repo>/target/debug/auto-ui-tool(.exe) \
#     cargo test --manifest-path test/fixtures/modularity/ui-tool-consumer/Cargo.toml
# 依赖闭包断言（V-01/V-05 oracle）：
#   bash test/fixtures/modularity/ui-tool-consumer/verify-deps.sh

[package]
name = "ui-tool-consumer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
auto-ui-tools = { path = "../../../../crates/auto-ui-tools" }
auto-tool-protocol = { path = "../../../../crates/auto-tool-protocol" }
auto-project-model = { path = "../../../../crates/auto-project-model", features = ["wire"] }
# 测试体在 lib 目标内(#[test] 函数随非 test cfg 的 lib 一同编译,dev-deps
# 在该目标不可用——与既有 modularity fixture 同口径),按探针 crate 直挂。
serde_json = "1.0"
tempfile = "3.14"

# 独立 workspace（见上）；无锁文件、无成员。
[workspace]
