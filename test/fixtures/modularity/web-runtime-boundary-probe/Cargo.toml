[package]
name = "web-runtime-boundary-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
# Required opt-in source-boundary audit; the empty default is not a check.
boundary = []
# PLAN-901：Core 测试 HTTP helper 已常驻——本探针同名 feature 保留（外部
# 入口兼容），语言侧转发退役。
test-http-e2e = []

[dependencies]
auto-web={path="../../../../../auto-web/crates/auto-web"}
auto-lang-core = { path = "../../../../crates/auto-lang-core" }
a2r-std = { path = "../../../../crates/a2r-std" }
auto-val = { path = "../../../../crates/auto-val", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
socket2 = "0.5"
serde_json = "1"
futures = "0.3"
lazy_static = "1.4"
base64 = "0.22"
sha1 = "0.10"

[profile.dev]
debug = "line-tables-only"
