[package]
name = "auto-av-probe"
version = "0.1.0"
edition = "2021"
description = "PLAN-798 auto-av-probe: managed cache units, native cross-check reference, driver/observations and the bounded worker for the ac-av vertical probe. HIR→MIR lowering is consumed from the shared auto-mir-lower crate (PLAN-868)."
publish = false

[features]
default = []
# Explicit test tooling; absent from ordinary worker builds.
test-case-batch = []

[dependencies]
auto-av-core = { path = "../core" }
auto-mir-lower = { path = "../../auto-mir-lower" }
ac-sema-contract = { path = "../../ac-semantics/contract" }
auto-ac-prototype = { path = "../../ac-core" }
ac-artifact-probe = { path = "../../ac-artifact-probe" }
ac-syntax-rt = { path = "../../ac-syntax/runtime" }
ac-syntax-grammar = { path = "../../ac-syntax/grammar" }
ac-syntax-core-adapter = { path = "../../ac-syntax/adapters/core" }
rusqlite = { version = "0.30", features = ["bundled"] }
base64 = "0.22"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# PLAN-820 F820-R1-02: parent-side per-PID private-bytes polling (the same
# windows-sys surface ac-artifact-probe's sysinfo uses).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
# PLAN-827: seed-identity receipts (SHA256 over the frozen AP fixture bytes).
sha2 = "0.10"
