[package]
name = "ace-aac-syntax-conformance"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false
description = "PLAN-1046 AAC syntax runtime / source projection / module assembly: the Auto stage driver (aac/syntax/*.at + aac/source/*.at) compiled on the assembled packages-aggregates-ct lane and executed by an explicitly prepared native driver, with the Rust ace-syntax-runtime/ace-core front door as the independent same-source oracle (byte-exact canonical CST/AST/catalog parity, frozen grammar identity binding, budget/edit/position negative controls)"

[dependencies]
ace-a2x-rust = { path = "../../crates/a2x-rust" }
ace-a2x-store = { path = "../../crates/a2x-store" }
ace-aac-host-conformance = { path = "../aac-host", optional = true }
ace-abi = { path = "../../crates/abi", optional = true }
ace-native = { path = "../../crates/native", optional = true }
auto-tool-execution = { path = "../../../../crates/auto-tool-execution" }
blake3 = "1"
ace-core = { path = "../../crates/core" }
ace-source-query = { path = "../../crates/source-query" }
ace-av = { path = "../../crates/av" }
ace-av-core = { path = "../../crates/av-core" }
ace-syntax-runtime = { path = "../../crates/syntax-runtime" }
ace-syntax-grammar = { path = "../../crates/syntax-grammar" }
serde_json = { version = "1", optional = true }

[dev-dependencies]
ace-lowering = { path = "../../crates/lowering" }
ace-aac-bridge = { path = "../../crates/aac-bridge" }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[features]
aac-semantics = []
aac-foreign-semantics = ["aac-semantics", "dep:ace-abi", "dep:serde_json"]
aac-ct-bootstrap = ["aac-semantics", "dep:ace-aac-host-conformance", "dep:ace-native", "dep:serde_json"]

[[bin]]
name = "prepare-semantic-foreign"
path = "src/bin/prepare-semantic-foreign.rs"
required-features = ["aac-foreign-semantics"]

[[test]]
name = "semantic_conformance"
path = "tests/semantic_conformance.rs"
required-features = ["aac-semantics"]

[[test]]
name = "semantic_foreign"
path = "tests/semantic_foreign.rs"
required-features = ["aac-foreign-semantics"]

[[test]]
name = "aac1050_mir"
path = "tests/aac1050_mir.rs"
required-features = ["aac-semantics"]

[[test]]
name = "aac1050_bridge"
path = "tests/aac1050_bridge.rs"
required-features = ["aac-semantics"]
