[package]
name = "ace-aac-gen1-conformance"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false
description = "PLAN-1053 T-02: the whole AAC subject tree S (experimental/ace/aac/**/*.at, 60 modules) compiled by the bound Gen0 toolchain into one real native AC (mn) Gen1 executable, with source-bound identity manifest admission and an AV-lane independent oracle for the whole-subject boot reduction"

[dependencies]
ace-a2x-rust = { path = "../../crates/a2x-rust" }
ace-a2x-store = { path = "../../crates/a2x-store" }
ace-aac-host-conformance = { path = "../aac-host" }
ace-aac-syntax-conformance = { path = "../aac-syntax" }
ace-aac-bridge = { path = "../../crates/aac-bridge" }
ace-av-core = { path = "../../crates/av-core" }
ace-core = { path = "../../crates/core" }
ace-native = { path = "../../crates/native" }
ace-source-query = { path = "../../crates/source-query" }
auto-tool-execution = { path = "../../../../crates/auto-tool-execution" }
blake3 = "1"
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
auto-test-case = { path = "../../../../crates/auto-test-case" }

[[test]]
name = "gen1"
path = "tests/gen1.rs"

[[bin]]
name = "prepare-gen1"
path = "src/bin/prepare-gen1.rs"
