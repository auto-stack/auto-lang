[workspace]
resolver = "2"
members = [
  "crates/a2x-c",
  "crates/a2x-core",
  "crates/a2x-rust",
  "crates/a2x-store",
  "crates/a2x-worker",
  "crates/abi",
  "crates/artifacts",
  "crates/av",
  "crates/av-core",
  "crates/case-worker",
  "crates/collections-runtime",
  "crates/comptime",
  "crates/comptime-contract",
  "crates/comptime-core",
  "crates/core",
  "crates/data-runtime",
  "crates/foreign-contract",
  "crates/lowering",
  "crates/native",
  "crates/semantics",
  "crates/semantics-contract",
  "crates/semantics-store",
  "crates/source-query",
  "crates/syntax-artifacts",
  "crates/syntax-core",
  "crates/syntax-grammar",
  "crates/syntax-runtime",
  "crates/text-runtime",
  "crates/trace-runtime",
  "crates/typed-entry-runtime",
  "tests/conformance",
  "tests/stdlib",
  "tests/data-runtime",
  "tests/text-runtime"
]
default-members = ["crates/core", "crates/av-core", "crates/syntax-runtime", "crates/syntax-grammar", "crates/semantics-contract"]

# PLAN-899: members keep line tables for line-level diagnostics in dev/test;
# the wildcard override applies only to non-workspace-member dependencies
# (workspace members are never matched by package."*"), which stay debug-free.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

# PLAN-927：统一 CST 规则机是热路径（Frame 栈步进），debug 无优化下大源
# 墙钟差一个量级（267KB deck：release 74ms / debug ~400ms——cte 300ms
# deadline 合同穿底）。测试档对语法运行时开 O2（不改变语义，只补回被
# debug 抹掉的数量级）。
[profile.test.package.ace-syntax-runtime]
opt-level = 2

[profile.release]
debug = false

[profile.full-debug]
inherits = "dev"
debug = 2

# Former standalone syntax workspace release contract.
[profile.syntax-release]
inherits = "release"
debug = true

# Former native staticlib workspace contracts (not a global panic change).
[profile.runtime-dev]
inherits = "dev"
panic = "abort"

[profile.runtime-release]
inherits = "release"
panic = "abort"
