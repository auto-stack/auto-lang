[package]
autotests = false
name = "ace-a2x-worker"
version = "0.1.0"
edition = "2021"
description = "PLAN-892 T-02 private true-chain probe: source -> Checked HIR -> view -> Rust -> real rustc -> run -> oracle"
publish = false

[dependencies]
auto-tool-execution = { path = "../../../../crates/auto-tool-execution" }
ace-a2x-c = { path = "../a2x-c" }
ace-a2x-core = { path = "../a2x-core" }
ace-a2x-python = { path = "../a2x-python" }
ace-abi = { path = "../abi" }
ace-artifacts = { path = "../artifacts" }
ace-a2x-rust = { path = "../a2x-rust" }
ace-a2x-store = { path = "../a2x-store" }
ace-core = { path = "../core" }
ace-source-query = { path = "../source-query" }
ace-source-cte = { path = "../source-cte" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"
