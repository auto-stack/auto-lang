[package]
autotests = false
name = "ace-a2x-worker"
version = "0.1.0"
edition = "2021"
description = "PLAN-892 T-02 private true-chain probe: source -> Checked HIR -> view -> Rust -> real rustc -> run -> oracle"
publish = false

[features]
default = []
# PLAN-1098 T-06: explicit toolchain-certification cases (real cl/rustc legs);
# absent from every ordinary/daily selection.
test-toolchain = []

[dependencies]
auto-tool-execution = { path = "../../../../crates/auto-tool-execution" }
# PLAN-1116 T-03: the language lane's prepared foreign provider closure
# (the same importer/digests the AV lane binds; no second importer).
auto-bindgen = { path = "../../../../crates/auto-bindgen" }
base64 = "0.22"
# PLAN-1034: pyrun 解释器内容 hash 流式计算（不整缓存 binary）。
sha2 = "0.10"
ace-a2x-c = { path = "../a2x-c" }
ace-a2x-core = { path = "../a2x-core" }
ace-a2x-python = { path = "../a2x-python" }
ace-abi = { path = "../abi" }
ace-artifacts = { path = "../artifacts" }
ace-a2x-rust = { path = "../a2x-rust" }
ace-a2x-store = { path = "../a2x-store" }
ace-a2x-ts = { path = "../a2x-ts" }
ace-core = { path = "../core" }
ace-source-query = { path = "../source-query" }
ace-source-cte = { path = "../source-cte" }
ace-foreign-contract = { path = "../foreign-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
# PLAN-1116 T-03: the foreign probe derives the prepared-closure digests
# with the SAME importer the worker binds (no second importer).
auto-bindgen = { path = "../../../../crates/auto-bindgen" }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"
