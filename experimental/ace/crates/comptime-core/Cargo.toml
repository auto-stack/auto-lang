[package]
name = "ace-comptime-core"
version = "0.1.0"
edition = "2021"
description = "PLAN-817 CTE core: consumer bidirectional binding (SemaInput substitution + HIR backfill), dependency fingerprints and the query scheduler — over the landed 796 semantic core and ac-core public HIR/verify APIs."
publish = false

[dependencies]
ace-comptime-contract = { path = "../comptime-contract" }
ace-semantics-contract = { path = "../semantics-contract" }
ace-semantics = { path = "../semantics", features = ["core-ast"] }
ace-core = { path = "../core" }
serde_json = "1"
