[package]
name = "ace-a2x-store"
version = "0.1.0"
edition = "2021"
description = "PLAN-892 A2X cache/session layer: layered function keys over the 783 ManagedStore/CAS, resident reuse, producer accounting, quota; PLAN-921 target-provider seam (no target-private deps)"
publish = false

[dependencies]
ace-a2x-core = { path = "../a2x-core" }
ace-core = { path = "../core" }
ace-artifacts = { path = "../artifacts" }
ace-source-query = { path = "../source-query" }
ace-semantics-contract = { path = "../semantics-contract" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PLAN-936（T-13 F-1 修复）：CT 需求的 Rust/C 产品车道接线（a2x-store →
# source-cte 单向；服务永不反依赖 a2x）。
ace-source-cte = { path = "../source-cte" }
