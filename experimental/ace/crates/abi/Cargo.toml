[package]
autotests = false
name = "ace-abi"
version = "0.1.0"
edition = "2021"
description = "PLAN-797 first bounded AutoABI candidate profile + bidirectional native interop probe (AutoABI<->AutoABI, AutoABI->C, C->AutoABI)"
publish = false

# Standalone workspace on purpose (plan §1/§2): the probe owns its own
# Cargo.lock and must not enter the auto-lang product build graph, the
# ac-core workspace, or any production crate's dependency set. It consumes
# the already-merged ac-core link/executor entries and the 783 managed
# store via path deps (same pattern as probes/data-resources and
# ac-artifact-probe). It is NOT an Auto-source compiler front end: modules
# are emitted from a frozen, bounded declaration IR (plan §0/§5.2).
[dependencies]
# REAL ac-core entries reused verbatim (plan §3): find_rust_lld /
# find_sdk_um_dir / link_object_staged / run_deadlined_split.
ace-core = { path = "../core" }
# 783 managed store for the first layout/object cache (plan §5.4):
# probe-owned layers, zero modification of the 783/787 layer registry.
ace-artifacts = { path = "../artifacts" }
# REAL semantic contract (D-796 delivered): 797 consumes the merged
# PLAN-796 contract read-only for nominal refs/content versions/type
# descriptions (T-06; the local semref snapshot adapter is retired).
ace-semantics-contract = { path = "../semantics-contract" }
# PLAN-937 CA-D1: the neutral interface-facts/physical-plan model both
# real consumers (native emit/admission + A2C wrapper) bind to.
ace-foreign-contract = { path = "../foreign-contract" }
# PLAN-937 CA-D1 bridge host composition: the real source->C provider
# stack (checked frontdoor consumption, C fragments/fileset). Direction
# is abi->a2x only; a2x-* never depends on ace-abi.
ace-a2x-core = { path = "../a2x-core" }
ace-a2x-c = { path = "../a2x-c" }
ace-a2x-store = { path = "../a2x-store" }
ace-native = { path = "../native" }
ace-source-query = { path = "../source-query" }
ace-av-core = { path = "../av-core" }
ace-lowering = { path = "../lowering" }
# Cranelift stack pinned to the same versions as ac-core (plan §3).
cranelift-codegen = "0.126"
cranelift-frontend = "0.126"
cranelift-module = "0.126"
cranelift-object = "0.126"
target-lexicon = "0.13"
blake3 = "1.5"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
object = "0.37"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Environment"] }

[dev-dependencies]
ace-a2x-rust = { path = "../a2x-rust" }

[[bin]]
name = "abi-worker"
path = "src/bin/abi-worker.rs"

[[bin]]
name = "source-foreign-restore-probe"
path = "src/bin/source-foreign-restore-probe.rs"


[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "source_resources"
path = "tests/source_resources.rs"
