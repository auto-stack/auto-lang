# fields; values identical to this workspace's [workspace.package].
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake3 = "1.5"

[dev-dependencies]
# PLAN-1058: autodown_mixed_editing 集成测试用真实 Auto 语法资产（dev 循环
# 依赖合法：grammar 依赖 runtime 的编译期方向不受影响）。
ace-syntax-grammar = { path = "../syntax-grammar" }
