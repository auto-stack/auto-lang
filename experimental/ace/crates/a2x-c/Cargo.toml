[package]
name = "ace-a2x-c"
version = "0.1.0"
edition = "2021"
description = "PLAN-921 CA-A: the HIR→C11 scalar emit target (checked i32 helpers, source-order single evaluation, short-circuit, hygienic naming) behind the shared TargetProvider seam"
publish = false

[dependencies]
ace-a2x-core = { path = "../a2x-core" }
# PLAN-937 CA-D1: the neutral lane/projection vocabulary shared with the
# abi side (pure model crate — no backend stack inside).
ace-foreign-contract = { path = "../foreign-contract" }
ace-core = { path = "../core" }
# PLAN-938: borrowed fileset manifest serialization (exact output admission
# without a serde_json Value tree); same serde the contract crate already pins.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
