[package]
autotests = false
name = "ace-av-core"
version = "0.1.0"
edition = "2021"
description = "PLAN-798 auto-av-core: Typed MIR model/verifier, ABC wire codec/verifier and the Rust AV executor for the limited av.core-i32/1 profile. Pure std — no auto-lang/UI/man/Cranelift dependencies."
publish = false

[dependencies]
# Backend-free declaration data, shared with HIR and both foreign consumers.
ace-foreign-contract = { path = "../foreign-contract" }
serde_json = "1"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "foreign_resources"
path = "tests/foreign_resources.rs"

# PLAN-1040: the Linux AV runner — a static musl binary executing the
# shared checked console ABC on the real Linux platform backend.
[[bin]]
name = "mn-linux-av-runner"
path = "src/bin/mn-linux-av-runner.rs"
