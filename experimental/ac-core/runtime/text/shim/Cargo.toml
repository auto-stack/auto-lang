[package]
name = "ac-text-runtime-shim"
version = "0.1.0"
edition = "2021"
description = "PLAN-770 text runtime: callee side of the text-profile internal ABI (774 data-resource contract, isomorphic rename)"
publish = false

# Workspace member of the runtime/text workspace (built as a staticlib the
# tests link; the ac-core build consumes the same artifact via --support-lib
# plus its .contract.json sidecar). The no_std #[panic_handler] in
# src/lib.rs never returns, so no unwinding can cross the ABI regardless of
# profile.

[lib]
crate-type = ["staticlib"]
name = "ac_text_runtime"

[dependencies]
