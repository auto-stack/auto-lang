[package]
name = "ac-data-shim-774"
version = "0.1.0"
edition = "2021"
description = "PLAN-774 explicit-ABI resource runtime shim: callee side of the five frozen internal ABI categories"
publish = false

# Workspace member of the probe workspace (built as a staticlib on demand by
# the tests; never linked into the ac-core workspace). The no_std
# #[panic_handler] in src/lib.rs never returns, so no unwinding can cross the
# probed ABI regardless of profile.

[lib]
crate-type = ["staticlib"]

