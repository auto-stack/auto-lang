[package]
name = "auto-ac-prototype"
version = "0.1.0"
edition = "2021"
description = "PLAN-741 AC closed-loop prototype: Atom HIR text -> verified HIR -> Windows x64 native AOT"
publish = false

[workspace]

[dependencies]
# Cranelift backend stack (selected in T-01; see docs/reports/741-ac-hir-native/toolchain.md)
cranelift-codegen = "0.126"
cranelift-frontend = "0.126"
cranelift-module = "0.126"
cranelift-object = "0.126"
target-lexicon = "0.13"
anyhow = "1"
# Phase 3 (R2-QA-02): Job Object containment for the deadline executor —
# descendants that inherit our stdout/stderr pipes must die with the direct
# child, or the post-exit output collection can wait forever. Only the
# JobObjects/Foundation surface is enabled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# COFF symbol inspection for native_execution tests
object = "0.37"

[profile.release]
debug = false
