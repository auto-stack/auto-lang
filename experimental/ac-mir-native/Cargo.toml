[package]
name = "ac-mn"
version = "0.1.0"
edition = "2021"
publish = false
description = "PLAN-818: shared CheckedMir -> per-function COFF -> multi-obj PE, unit cache and the native parity loop"

[workspace]
resolver = "2"

[dependencies]
auto-ac-prototype = { path = "../ac-core" }
auto-av-core = { path = "../ac-av-probe/core" }
auto-av-probe = { path = "../ac-av-probe/probe" }
auto-mir-lower = { path = "../auto-mir-lower" }
ac-artifact-probe = { path = "../ac-artifact-probe" }
cranelift-codegen = "0.126"
cranelift-frontend = "0.126"
cranelift-module = "0.126"
cranelift-object = "0.126"
target-lexicon = "0.13"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "mn-worker"
path = "src/bin/mn-worker.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
