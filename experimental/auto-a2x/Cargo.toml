# PLAN-892 T-02: the A2X experimental workspace — an INDEPENDENT Cargo
# workspace (like every experimental/ tree; the root product workspace does
# not depend on it). Three roles per Design51 §3:
#   a2x-core  — shared, target-neutral semantic view over verified HIR
#   a2x-rust  — the first real target provider (Rust, edition 2021)
#   probe     — private true-chain driver (source → HIR → Rust → rustc → run)
# Path dependencies only; no junctions/symlinks ever.
[workspace]
resolver = "2"
members = ["a2x-core", "a2x-rust", "a2x-store", "probe"]
