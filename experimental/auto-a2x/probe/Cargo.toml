[package]
name = "a2x-probe"
version = "0.1.0"
edition = "2021"
description = "PLAN-892 T-02 private true-chain probe: source -> Checked HIR -> view -> Rust -> real rustc -> run -> oracle"
publish = false

[dependencies]
auto-a2x-core = { path = "../a2x-core" }
auto-a2x-rust = { path = "../a2x-rust" }
auto-a2x-store = { path = "../a2x-store" }
auto-ac-prototype = { path = "../../ac-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
