[package]
name = "auto-cte-probe"
version = "0.1.0"
edition = "2021"
description = "PLAN-817 CTE probe: AV driver over the merged 798 execution services, frozen-value store over the PLAN-783 ManagedStore, consumer driver, cteworker/1 worker and observations."
publish = false

[dependencies]
auto-cte-contract = { path = "../contract" }
auto-cte-core = { path = "../core" }
auto-av-core = { path = "../../ac-av-probe/core" }
auto-av-probe = { path = "../../ac-av-probe/probe" }
auto-ac-prototype = { path = "../../ac-core" }
ac-sema-core = { path = "../../ac-semantics/core", features = ["core-ast"] }
ac-sema-contract = { path = "../../ac-semantics/contract" }
ac-artifact-probe = { path = "../../ac-artifact-probe" }
# The restore-bound probe (F-817-R7-01) reads the store's OWN chunk
# metadata (`chunks.size`, the framed byte length) through the public
# `ManagedStore::db()` handle — same version/features as the store.
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
