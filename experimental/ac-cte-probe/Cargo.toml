[workspace]
resolver = "2"
members = ["contract", "core", "probe"]

# PLAN-817 AV-driven CTE query + frozen-cache probe workspace.
# Standalone (same pattern as ../ac-av-probe): `contract` is
# dependency-free schema/admission types, `core` carries the consumer
# mapping over the landed 796/ac-core public APIs (no UI/Man/old VM/
# Cranelift in the default closure), `probe` consumes the merged 798
# execution services (auto-av-core), the PLAN-783 ManagedStore and the
# ac-core native reference path.
#
# Frozen decisions live in ./contract-decision.md (T-01, r1.1).

[profile.release]
debug = false

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.full-debug]
inherits = "dev"
debug = 2
