[package]
name = "auto-cte-core"
version = "0.1.0"
edition = "2021"
description = "PLAN-817 CTE core: consumer bidirectional binding (SemaInput substitution + HIR backfill), dependency fingerprints and the query scheduler — over the landed 796 semantic core and ac-core public HIR/verify APIs."
publish = false

[dependencies]
auto-cte-contract = { path = "../contract" }
ac-sema-contract = { path = "../../ac-semantics/contract" }
ac-sema-core = { path = "../../ac-semantics/core", features = ["core-ast"] }
auto-ac-prototype = { path = "../../ac-core" }
serde_json = "1"
