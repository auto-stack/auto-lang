# Plan 466: full 档 nextest 配置(cargo tf / ta / taa 经 --config-file 指定)。
# --config-file 是整体替换而非合并,本文件需自成一体。
# Plan 532: 排除嵌套塔里程碑测试(aavm2_t3_tower_milestone)——塔仅 t3 档跑。
# Plan 568: taa(aavm 档)/ta(全量)均经本配置——aavm 重测试(XL/LG)的
# 主运行档即在此,组限流为 2GB 预算的执行机制。
#
# Plan 564: 三组内存限流(实测数据:.config/test-mem-weights.md)。
# 最坏并发 = XL(1×~931MB) + LG(1×~797MB) + MD(2×~138MB) + 轻池
# ≈ 2GB 预算内(A4 实测 tf aavm2_ 树峰 1674MB)。lg=2 曾被预算否决。
[profile.default]
default-filter = "not test(aavm2_t3_tower_milestone)"

# fix-test-stability(2026-09-30): slow-timeout 保护——无截止挂起(e4 式 accept/
# join)在全量档同样会卡死批量回归。全量档合法长测试:画廊围栏 ~800s 冷态、
# aavm XL 单测 78-303s → 900s 警告/1800s 终止不误伤。
[profile.default.slow-timeout]
period = "900s"
terminate-after = 2

[test-groups]
fixed-http = { max-threads = 1 }
mem-xl = { max-threads = 1 }
mem-lg = { max-threads = 1 }
mem-md = { max-threads = 2 }
ffi-dual = { max-threads = 1 }

# ACE formal measurements run without overlapping other tests in this invocation.
# https://nexte.st/docs/configuration/threads-required/
[[profile.default.overrides]]
filter = "test(/::performance::/)"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "test(test_aavm2_p532_lib_static_diff) or test(test_aavm2_fourpath_runner) or test(test_aavm2_a2r_is_corpus) or test(test_aavm2_m4_codegen_corpus) or test(test_aavm2_m5_engine_corpus) or test(test_aavm2_m2_parser_corpus) or test(test_aavm2_m5_use_corpus) or test(test_aavm2_m4_use_corpus) or test(test_aavm2_m3_typeinfo_corpus) or test(test_aavm2_m1_lexer_corpus) or test(test_aavm2_m3_milestone_fib) or test(test_aavm2_a2r_probe_smoke)"
test-group = "mem-xl"

[[profile.default.overrides]]
filter = "test(test_aavm2_m5_use_errors) or test(test_aavm2_001_smoke) or test(test_aavm2_compile_corpus) or test(test_aavm2_compile_use_corpus)"
test-group = "mem-lg"

[[profile.default.overrides]]
filter = "test(test_aavm2_goldens_check) or test(test_aavm2_a2r_main_dump_print) or test(test_aavm2_a2r_corpus_rustc) or test(test_aavm2_002_hello_compile)"
test-group = "mem-md"

# PLAN-840 Phase 2: these wall-clock oracles require an uncontended test pool.
# Reserve the CURRENT pool (including -j overrides), retaining every selected test,
# frozen input and original assertion. A one-thread test group alone cannot isolate
# these tests from unrelated processes in this nextest invocation.
[[profile.default.overrides]]
filter = 'test(=tests::plan716_supply_probes::plan716_supply::diff_window_census) | test(=tests::turnaround::performance::probe_adapter_turnaround_ipc_hard_gate_p95)'
threads-required = "num-test-threads"

# PLAN-840 Phase 2: --config-file replaces the daily configuration entirely.
# Bind the already-declared group, mirroring the daily shared-fixture policy.
# Defining max-threads without assigning ffi_dual tests provides no isolation.
[[profile.default.overrides]]
filter = "test(ffi_dual)"
test-group = "ffi-dual"

# PLAN-896: preserve HTTP family serial access across fixed groups.
[[profile.default.overrides]]
filter = "test(/http/)"
test-group = "fixed-http"

# These three functional counter-controls assert the original short wall/IPC
# deadlines. Reserve this invocation's pool; keep every assertion and budget.
[[profile.default.overrides]]
filter = "binary(=conformance) and (test(=native_lifecycle::r3_parent_io_lifecycle_overcap_and_deadline) or test(=tests::language_conformance::ace_m1_native_collections_actual_missing_free_turns_parent_red) or test(=tests::language_conformance::ace_m1_native_collections_real_whole_work_and_code_copy_turn_sdk_red))"
threads-required = "num-test-threads"
