# Plan 466: full 档 nextest 配置(cargo tf / ta / taa 经 --config-file 指定)。
# --config-file 是整体替换而非合并,本文件需自成一体。
# Plan 532: 排除嵌套塔里程碑测试(aavm2_t3_tower_milestone)——塔仅 t3 档跑。
# Plan 568: taa(aavm 档)/ta(全量)均经本配置——aavm 重测试(XL/LG)的
# 主运行档即在此,组限流为 2GB 预算的执行机制。
#
# Plan 564: 三组内存限流(实测数据:.config/test-mem-weights.md)。
# 最坏并发 = XL(1×~931MB) + LG(1×~797MB) + MD(2×~138MB) + 轻池
# ≈ 2GB 预算内(A4 实测 tf aavm2_ 树峰 1674MB)。lg=2 曾被预算否决。
[profile.default]
default-filter = "not test(aavm2_t3_tower_milestone)"

# fix-test-stability(2026-09-30): slow-timeout 保护——无截止挂起(e4 式 accept/
# join)在全量档同样会卡死批量回归。全量档合法长测试:画廊围栏 ~800s 冷态、
# aavm XL 单测 78-303s → 900s 警告/1800s 终止不误伤。
[profile.default.slow-timeout]
period = "900s"
terminate-after = 2

# PLAN-1067 review3 T-1067-2: the native scheduler gate cases each compile,
# link and run REAL PEs. Under the full pool (20 parallel tests) their per-case
# wall time swung from ~0.2-3 s to >10 s purely from sibling contention, which
# violates the per-case 10 s budget even though every assertion passed.
# Serializing this binary only (not the whole pool) keeps the cases cheap and
# deterministic; nothing about their inputs or assertions changes.
[test-groups]
sched-native = { max-threads = 1 }
fixed-http = { max-threads = 1 }
mem-xl = { max-threads = 1 }
mem-lg = { max-threads = 1 }
mem-md = { max-threads = 2 }
ffi-dual = { max-threads = 1 }
# PLAN-1056 N-4: every `ace-aac` case compiles the frozen Auto support package
# through the Gen0 frontend and executes it on the AV executor, so a case's wall
# time is dominated by an in-process compile. Run the whole pool at once
# (max_parallel_tests_observed=20) and 20 of 23 cases blew the per-case 10 s
# budget purely from sibling contention (serial -j1 is 2.1-9.3 s). Bound the
# GROUP instead of passing `-j` (the fixed-group runner owns `-j`), following the
# mem-xl/mem-lg/mem-md precedent; inputs, assertions and budgets are unchanged.
# Bound = 4 (measured on this 14-core host): on an idle window the whole result
# is 25/25 in 26.07 s with a per-case max of 8.05 s, while other plans' builds
# (8-22 concurrent cargo/rustc/cl processes) inflate every case regardless of
# this bound — 4 threads 12.9-15.2 s, 2 threads 17.4-20.3 s (and one 9.65 s
# window) — so the smaller bound only costs wall time. The self-contention this
# group removes is what pushed 20 of 23 cases past 10 s; the residual is
# external load, not this package.
ace-aac = { max-threads = 4 }
# PLAN-1045: the `ace-aac-host` cases share the ace-aac cost shape — each
# case compiles the host client + frozen aac-support digest through the
# Gen0 frontend (AV legs) and the native leg additionally lowers, links
# and runs a real PE. Bound the group the same way (fixed-group runner
# owns `-j`); inputs, assertions and budgets are unchanged.
ace-aac-host = { max-threads = 4 }
# PLAN-983 r27：UI rq/headless 媒体渲染族（rq_wire/rq_probe/rq_matrix/
# rq_repair/rq_media/rq_cells/rqhost）在 full 池并发下互相竞争崩溃/假红
# （0xc0000005 ABORT 与吞吐断言红，失败集合逐轮漂移；族内 68 例单独并发
# 即复现 3 红——非全池独有）。plan498 图表交互族同证（池内 2/2 红：
# BarChart.Hover VM IndexError 时敏假红；单测 3/3 绿——VM 分片调度在
# 负载下交错暴露，底层交错竞态具名为 charts owner 债务候选）。同
# PLAN-1067 sched-native 先例：仅串行本族，输入/断言/预算零变化。UI 仓
# 日常档（auto-ui .config/nextest.toml）对 rq 媒体族已有同等纪律；本条
# 把该纪律带进 full 档（四仓门 ui-full 腿用本配置）。
# 共享门禁口径变更——测试治理维护方复核（r26 阶段条款）。
rq-native = { max-threads = 1 }

# ACE formal measurements run without overlapping other tests in this invocation.
# https://nexte.st/docs/configuration/threads-required/
[[profile.default.overrides]]
filter = "test(/(^|::)performance::/)"
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = "test(test_aavm2_p532_lib_static_diff) or test(test_aavm2_fourpath_runner) or test(test_aavm2_a2r_is_corpus) or test(test_aavm2_m4_codegen_corpus) or test(test_aavm2_m5_engine_corpus) or test(test_aavm2_m2_parser_corpus) or test(test_aavm2_m5_use_corpus) or test(test_aavm2_m4_use_corpus) or test(test_aavm2_m3_typeinfo_corpus) or test(test_aavm2_m1_lexer_corpus) or test(test_aavm2_m3_milestone_fib) or test(test_aavm2_a2r_probe_smoke)"
test-group = "mem-xl"

[[profile.default.overrides]]
filter = "test(test_aavm2_m5_use_errors) or test(test_aavm2_001_smoke) or test(test_aavm2_compile_corpus) or test(test_aavm2_compile_use_corpus)"
test-group = "mem-lg"

[[profile.default.overrides]]
filter = "test(test_aavm2_goldens_check) or test(test_aavm2_a2r_main_dump_print) or test(test_aavm2_a2r_corpus_rustc) or test(test_aavm2_002_hello_compile)"
test-group = "mem-md"

# PLAN-840 Phase 2: these wall-clock oracles require an uncontended test pool.
# Reserve the CURRENT pool (including -j overrides), retaining every selected test,
# frozen input and original assertion. A one-thread test group alone cannot isolate
# these tests from unrelated processes in this nextest invocation.
[[profile.default.overrides]]
filter = 'test(=tests::plan716_supply_probes::plan716_supply::diff_window_census) | test(=tests::turnaround::performance::probe_adapter_turnaround_ipc_hard_gate_p95)'
threads-required = "num-test-threads"

# PLAN-840 Phase 2: --config-file replaces the daily configuration entirely.
# Bind the already-declared group, mirroring the daily shared-fixture policy.
# Defining max-threads without assigning ffi_dual tests provides no isolation.
[[profile.default.overrides]]
filter = "test(ffi_dual)"
test-group = "ffi-dual"

[[profile.default.overrides]]
filter = "test(/^scheduler_/) or test(/^av_leg::av_lane/)"
test-group = "sched-native"

# PLAN-983 r27：rq/headless 媒体渲染族 + plan498 图表交互族入串行组
# （证据与归属见上 rq-native 注释；filter 匹配 rqhost::tests 与
# headless::rq_* 各模块及 plan498_chart_interaction_tests）。
[[profile.default.overrides]]
filter = "test(/(^|::)rq/) or test(/^ui_tests::plan498_chart_interaction_tests/)"
test-group = "rq-native"

# PLAN-983 r27：p073 1080p 连续媒体流吞吐门（t01 容量/t02 豁免正控/t05
# 两 Host 语义）——镜像 UI 仓日常档 PLAN-073 T-02/T-05 纪律：吞吐/帧率门
# 只在隔离窗有效（并行重负载下 1080p debug 记录成本倍增，吞吐门必假红），
# 独占整机槽位预算。t01 为 r27 门内实测同族假红增补（原日常档仅列 t02/t05）。
[[profile.default.overrides]]
filter = 'test(p073_t01) or test(p073_t02) or test(p073_t05)'
threads-required = "num-cpus"

# PLAN-896: preserve HTTP family serial access across fixed groups.
[[profile.default.overrides]]
filter = "test(/http/)"
test-group = "fixed-http"

# These four functional counter-controls assert the original short wall/IPC
# deadlines. Reserve this invocation's pool; keep every assertion and budget.
[[profile.default.overrides]]
filter = "test(=native_lifecycle::r3_parent_io_lifecycle_overcap_and_deadline) or test(=tests::language_conformance::ace_m1_native_collections_actual_missing_free_turns_parent_red) or test(=tests::language_conformance::ace_m1_native_collections_real_whole_work_and_code_copy_turn_sdk_red) or test(=tests::mir_native_protocol::mir_native_rounds_failure_liveness_and_caps)"
threads-required = "num-test-threads"

# PLAN-938: source foreign publication/restart controls exercise real cl/link
# and retain the original short discovery/IPC deadlines. Reserve this invocation
# while each control runs; do not overlap its nested processes with this pool.
# PLAN-1060 T-05 (measured): the blanket `^source_foreign::` reservation made all
# 86 source-foreign tests run one-at-a-time (effective concurrency 1.86, module
# wall 213.5 s / 184.4 s across runs). Their bodies assert functional outcomes;
# the only wall-clock assertion in the file is the warm-edit P90 gate, which now
# lives in `::performance::` and stays reserved by the performance override
# above. Three consecutive full-module runs without the blanket reservation were
# green (48.5 s / 53.2 s / 47.2 s, 285/285 executed, effective concurrency 9.5)
# on a machine already running other plans' builds. The language-side protocol
# tests keep the pool reservation, which is what PLAN-938's own evidence names.
[[profile.default.overrides]]
filter = "test(/^test_cases::abi::source_protocol_tests::/)"
threads-required = "num-test-threads"

# PLAN-939 T-10: the resource over-budget cancellation control sets the
# host-scoped ABI_TEST_PRODUCED_BUDGET_BYTES process env for its duration;
# reserve the pool while it runs so no sibling worker entry reads the
# squeezed budget.
[[profile.default.overrides]]
filter = "test(abi_resource939_over_budget_cancellation_preserves_root_and_cleans_without_quota)"
threads-required = "num-test-threads"

# PLAN-939 T-14: the resource 6x30 formal sampling carries five hard
# P90<=2000ms gates over full certification requests (cl/link storms);
# it must not sample under sibling-test contention (marginal P90 blows
# under parallel load — reproduced rotating with the 797 hard gates in
# plain parallel runs). Reserve the pool while it runs.
[[profile.default.overrides]]
filter = "test(abi_resource939_six_scenarios_30_samples)"
threads-required = "num-test-threads"


# PLAN-1056 N-4: bind the `ace-aac` fixed group's cases to the bounded group
# declared above. The filter is the whole test PACKAGE (both test binaries), and
# the bound applies only when THIS config file is loaded — the fixed-group run
# (`cargo t ace-aac`) and an explicit
# `cargo nextest run -p ace-aac-support-conformance --config-file ../../.config/nextest-full.toml`.
# An ad-hoc `cargo nextest run -p ace-aac-support-conformance` WITHOUT
# `--config-file` uses the default discovery (no `[test-groups]` section at
# all), so it is NOT group-limited (PLAN-1056 N-8).
[[profile.default.overrides]]
filter = "package(ace-aac-support-conformance)"
test-group = "ace-aac"

# PLAN-1045: bind the `ace-aac-host` fixed group's cases to its bounded
# group (same discipline as ace-aac above; only under THIS config file).
[[profile.default.overrides]]
filter = "package(ace-aac-host-conformance)"
test-group = "ace-aac-host"

# PLAN-1016: explicitly selected formal pressure suite prioritizes stable
# measurements over throughput. Concurrency inside a test's own protocol
# witness is preserved; independent test cases never overlap.
[profile.ace-perf]
test-threads = 1
