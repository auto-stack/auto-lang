# Plan 466: cargo t 提速——默认档排除 1M 大规模 churn 测试
# Plan 532: 嵌套塔里程碑测试(aavm2_t3_tower_milestone,小时级)在日常档排除
#           ——仅 cargo t3(大版本升级)运行。
# Plan 568: aavm 腿已整体迁入 test-aavm feature(taa/ta/t3 档),无该 feature
#           的档(tt/tb/th)结构性不含 aavm 重测试。
# PLAN-700: 语料三族(vm_file_tests/cookbook_vm_tests/conformance_tests)
#           常驻编译,日常档 t 经本 default-filter 排除(镜像 churn 待遇);
#           tf(nextest-full.toml)不动=全档含语料;tv 走 [profile.tv]
#           (语料三族白名单,见文件尾)。
# fix-test-tiering(2026-09-30): 画廊围栏(widgets_gallery_all_front_pages_compile,
#   ~800s 单线程冷态、零缓存长杆)移出日常档——归批量回归档(tf/上游
#   auto-plan-regress 技能)所有;CI solo 检出无 auto-os 兄弟本就 SKIP,
#   不受影响。
# 裸 cargo test 不经 nextest,全量语义;重内存测试另有 Plan 564 heavy_gate
# 体内守门(裸路径秒退,NEXTEST/AUTO_LANG_HEAVY_MEM 双通道)。
#
# Plan 564: 重内存测试三组限流(数据:.config/test-mem-weights.md,2026-09-05
# 实测)。日常档因 568 feature 拆分不跑 aavm 重测试,组配置在此仅为兜底——
# 防裸 `cargo nextest run --features test-aavm`(未指定 --config-file)时
# 重测试全并发。组语义:mem-xl(max=1) ≥800MB 串行;mem-lg(max=1)
# 300-800MB 串行;mem-md(max=2) 100-300MB 并发 2。
# fix-test-stability(2026-09-30): slow-timeout 保护——e4_default_http_tests 式
#   无截止 accept/join 挂起曾把整跑无限卡死(双 run 现行实录)。日常档合法
#   长测试 p508 内嵌重建 ~44s,60s 警告/120s 终止不误伤(e4 三臂最坏 90s 已由
#   体内 recv_timeout 30s 定界,正常 <1s)。
# fix-ui-tier(2026-09-30): ui_gen:: 整族移出日常档,归新 `cargo tu` 档——
#   854 个代码生成测试每进程重付注册表构建税(nextest 每测试一进程,
#   OnceLock 缓存失效;实测日常档 6250/7900 测试秒在此族),tu 用单进程
#   libtest 使 setup 全档只付一次。tf 面(nextest-full.toml)不动=批量
#   回归仍全覆盖;ui::(iced 运行时,均摊 0.28s/测)留日常档。
[profile.default]
default-filter = "not test(str_churn_bounded_large) and not test(aavm2_t3_tower_milestone) and not test(vm_file_tests::) and not test(cookbook_vm_tests::) and not test(conformance_tests::) and not test(widgets_gallery_all_front_pages_compile) and not test(ui_gen::)"

[profile.default.slow-timeout]
period = "60s"
terminate-after = 2

[test-groups]
mem-xl = { max-threads = 1 }
mem-lg = { max-threads = 1 }
mem-md = { max-threads = 2 }
# PLAN-630 复审 F-1:ffi_dual 族共享 auto-cache（018/019 同 fixture 异
# features 的 pack 有竞窗），并行重叠时 wide 变体读到窄包（610590388736
# ≠ 5000000000 实录）。串行组隔离。
ffi-dual = { max-threads = 1 }

# PLAN-700: tv 档（cargo tv）= 语料三族白名单。与 t/tf 同一测试二进制
# （常驻化后三档零重编），只差 profile 选择；default-filter 语义=正向筛
# 语料族（与 default 档的排除行互为镜像）。
[profile.tv]
default-filter = "test(vm_file_tests::) or test(cookbook_vm_tests::) or test(conformance_tests::)"

# 名单与档位数据:.config/test-mem-weights.md(单一事实来源)。
# 新增重测试三步登记:测量(scripts/measure_test_mem.py) → 权重表定级
# → 此处(及 full/t3 配置)overrides + heavy_gate 接线。
[[profile.default.overrides]]
filter = "test(test_aavm2_p532_lib_static_diff) or test(test_aavm2_fourpath_runner) or test(test_aavm2_a2r_is_corpus) or test(test_aavm2_m4_codegen_corpus) or test(test_aavm2_m5_engine_corpus) or test(test_aavm2_m2_parser_corpus) or test(test_aavm2_m5_use_corpus) or test(test_aavm2_m4_use_corpus) or test(test_aavm2_m3_typeinfo_corpus) or test(test_aavm2_m1_lexer_corpus) or test(test_aavm2_m3_milestone_fib) or test(test_aavm2_a2r_probe_smoke)"
test-group = "mem-xl"

[[profile.default.overrides]]
filter = "test(test_aavm2_m5_use_errors) or test(test_aavm2_001_smoke) or test(test_aavm2_compile_corpus) or test(test_aavm2_compile_use_corpus)"
test-group = "mem-lg"

[[profile.default.overrides]]
filter = "test(test_aavm2_goldens_check) or test(test_aavm2_a2r_main_dump_print) or test(test_aavm2_a2r_corpus_rustc) or test(test_aavm2_002_hello_compile)"
test-group = "mem-md"

[[profile.default.overrides]]
filter = "test(ffi_dual)"
test-group = "ffi-dual"
