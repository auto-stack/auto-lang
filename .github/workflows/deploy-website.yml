# Deploy Auto Language Website to GitHub Pages
#
# This workflow builds the Auto Language documentation website
# and deploys it to GitHub Pages.
#
# When examples/widgets-gallery/ changes, the widgets-gallery is rebuilt with
# the Auto pipeline (auto build → dist) and synced into website/public/ui/gallery
# so the site serves the fresh Auto-implemented gallery at /ui/gallery/.

name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'examples/widgets-gallery/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout auto-lang
        uses: actions/checkout@v4
        with:
          path: auto-lang

      - name: Checkout book repo
        uses: actions/checkout@v4
        with:
          repository: autostack/book
          path: book
          # If the book repo is private, you may need a token:
          # token: ${{ secrets.BOOK_REPO_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Detect widgets-gallery changes
        id: gallery
        uses: dorny/paths-filter@v3
        with:
          working-directory: auto-lang
          filters: |
            widgets_gallery:
              - 'examples/widgets-gallery/**'

      # --- widgets-gallery build (only when the gallery source changed) ---
      - name: Setup Node
        if: steps.gallery.outputs.widgets_gallery == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        if: steps.gallery.outputs.widgets_gallery == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Rust
        if: steps.gallery.outputs.widgets_gallery == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Build auto CLI
        if: steps.gallery.outputs.widgets_gallery == 'true'
        run: cargo build --release -p auto
        working-directory: auto-lang

      - name: Build widgets-gallery
        if: steps.gallery.outputs.widgets_gallery == 'true'
        run: |
          ./target/release/auto build
          rm -rf ../website/public/ui/gallery
          mkdir -p ../website/public/ui/gallery
          cp -r gen/front/vue/dist/* ../website/public/ui/gallery/
        working-directory: auto-lang/examples/widgets-gallery
        env:
          # shadcn-vue add / pnpm install run inside `auto build`
          PNPM_HOME: /home/runner/.local/share/pnpm

      - name: Install Dependencies
        run: |
          cd auto-lang/website
          bun install --frozen-lockfile

      - name: Prepare Content
        run: |
          cd auto-lang/website
          node scripts/prepare-content.js

      - name: Build Website
        run: |
          cd auto-lang/website
          bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./auto-lang/website/.vitepress/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
