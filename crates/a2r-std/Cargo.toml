[package]
name = "a2r-std"
version = "0.1.0"
edition = "2021"
description = "Auto language standard library for a2r transpiled Rust code"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
# Plan 387: actor runtime for transpiled `task` definitions (unbounded mpsc +
# current-thread tokio spawn). `full` is required by the workspace default
# (Cargo.toml:56) and gives rt/sync/macros/time in one feature set.
tokio = { workspace = true, features = ["full"] }
sysinfo = { workspace = true }
# Plan 415-B1: SQLite backend for the `sqlite` stdlib module. `bundled`
# compiles SQLite from source (same pin as auto-cache), no system lib
# needed on Windows/MSVC.
rusqlite = { version = "0.30", features = ["bundled"] }
