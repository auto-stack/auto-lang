[package]
name = "auto"
version = "0.1.0"
edition = "2021"
default-run = "auto"

# PLAN-816 T-05：薄 CLI 组合——基座（Core 形态）= 语言 SDK（auto-lang-core）
# + 管理服务（auto-man-runtime）+ I-TOOL 客户端（auto-tool-client）；
# UI 工程 build/run/gen 一律经工具进程（无 auto-ui-tools 静态链接）；
# `ui-extra` 承载五操作协议面之外的 UI 静态面（ui_gen 注册表/蓝图、
# 桌面协议、docs UI 生成、jet 脚手架、裸脚本动态 UI 宿主）。旧
# auto-lang 兼容大包与 auto-man compat 门面退出本 crate 闭包。

[dependencies]
clap = { workspace = true }
auto-lang-core = { path = "../auto-lang-core" }
# PLAN-036 T-03（D4）：编译壳装配点——cmd_autodesk --autodesk-shell 缺省编译轨
#（mount_face 工厂注入；显式 AUTO_SHELL_PACK = 解释双轨）。PLAN-816 T-05：
# 壳=桌面 UI 域（闭包含 auto-ui-runtime{ui-iced}）——随 ui-extra 门控，
# Core 形态缺席。
shell-pack = { path = "../../../auto-ui/crates/shell-pack", optional = true }
auto-val = { path = "../auto-val" }
# 管理/编排单源（非 UI 服务；UI 臂经 ui_ops seam=ToolUiOps→工具进程）。
auto-man-runtime = { path = "../auto-man-runtime" }
# I-TOOL v1 客户端（M816-A 发布面 + M816-B 五操作）：spawn 真实工具进程。
auto-tool-client = { path = "../auto-tool-client" }
# owned 执行设施（PLAN-816 T-06：serve 分离 spawn/watch 终止原语/service
# rust 轨树归属——CLI 自身不重造子进程原语）。
auto-tool-execution = { path = "../auto-tool-execution" }
# 协议数据面（RunOutcome 等结果类型；只消费 815 单源协议声明）。
auto-tool-protocol = { path = "../auto-tool-protocol" }
# I-PROJECT 请求单源（基请求构造/交付根通道；只消费 815/809 声明）。
auto-project-model = { path = "../auto-project-model" }
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = "2.5.0"
indicatif = "0.18.3"
log = "0.4"
simplelog = "0.12"
colored = { workspace = true }
notify = { workspace = true }

# ---- ui-extra：五操作协议面之外的 UI 静态面（完整 profile 组成部分）----
auto-ui-compiler = { path = "../../../auto-ui/crates/auto-ui-compiler", optional = true }
auto-ui-runtime = { path = "../../../auto-ui/crates/auto-ui-runtime", optional = true }
auto-ui-dialect = { path = "../../../auto-ui/crates/auto-ui-dialect", optional = true }

[features]
# 完整 profile（现行默认交付形态）：全部命令支持面。
# Plan 040 裁定①: autodown 提为 default——auto-down 是旗舰消费方，任意
# `cargo build -p auto` 产出即含真渲染，`auto run -r vm` 不再静默降级
# textarea。autodown 依赖 UI runtime（VM 真渲染 natives）——Core 形态
# 不可开（诚实 textarea=旧无 autodown 行为）。
default = ["ui-extra", "python", "autodown"]
# 纯 Core profile（薄 CLI/无 UI 形态）：`--no-default-features --features core`。
# 闭包无 UI 实现（compiler/runtime/tools/dialect）、无旧 auto-lang 兼容
# 大包；UI 命令具名失败（工具发现缺失/形态缺面）。显式空别名。
core = []
# UI 静态面：ui/bp 注册表与蓝图、rqhost/autodesk 桌面协议、docs UI
# 生成、`new -t jet` 脚手架、裸脚本动态 UI（has_ui_keywords→iced 宿主）、
# UI 文法/宿主能力装配、os-config 主题读取、mpv。
ui-extra = [
    "dep:auto-ui-compiler",
    "dep:auto-ui-runtime",
    "dep:auto-ui-dialect",
    "dep:shell-pack",
]
python = ["auto-lang-core/python"]
with-file-history = ["auto-lang-core/with-file-history"]
autodown = ["ui-extra", "auto-ui-runtime/autodown"]

# PLAN-617 T-19/T-20: `video` 元素的 VM 原生命中播放面（libmpv DLL 运行时加载）。
# 运行期能力（非"开着才对"的后端选择），显式开启；零构建期原生依赖，
# 缺运行库走诚实降级。mpv 属 UI runtime 渲染面——Core 形态不可开。
mpv-native = ["ui-extra", "auto-ui-runtime/mpv-native"]
mpv-gpu = ["mpv-native", "auto-ui-runtime/mpv-gpu"]
mpv-widget = ["mpv-gpu", "auto-ui-runtime/mpv-widget"]
mpv = ["mpv-native", "mpv-gpu", "mpv-widget"]

[dev-dependencies]
tempfile = "3"
