[package]
name = "auto-ai-agent-a2r"
version = "0.1.0"
edition = "2021"
description = "auto-ai-agent — Auto-transpiled from .at (a2r→Rust). ReAct loop is Auto source; HTTP layer uses the real auto-ai-client crate (plan 013, option A)."

# Keep this crate OUT of the parent auto-lang workspace (it's a standalone
# assembly of transpiled files + cross-repo path deps).
[workspace]

[lib]
name = "auto_ai_agent_a2r"
path = "src/lib.rs"

[[bin]]
name = "auto-ai-react"
path = "src/main.rs"

[dependencies]
# a2r runtime (Map/List/format!/json helpers emitted by the transpiler) and the
# atom/val bridging crates all live in THIS repo (auto-lang/crates/*), so we use
# short same-repo sibling paths from rust/ (../auto-ai-agent → ../ = crates/).
# These resolve identically in the main checkout and in a .worktrees/<name>/
# checkout, since the sibling crates are co-located either way.
a2r-std = { path = "../../../auto-lang/crates/a2r-std" }
auto-atom = { path = "../../../auto-lang/crates/auto-atom" }
auto-val = { path = "../../../auto-lang/crates/auto-val" }

# Real Rust crates (option A: HTTP layer is hand-written Rust, not Auto).
# These live in the SIBLING auto-ai repo (D:/autostack/auto-ai). From the main
# checkout (crates/auto-ai-agent/rust/) we walk up 4 levels to reach autostack/
# (rust→auto-ai-agent→crates→auto-lang→autostack), then into auto-ai/crates/*.
#
# NOTE: this depth is correct for the main checkout. A .worktrees/<name>/ checkout
# is one directory deeper, so building there requires a junction/symlink
# `auto-ai` -> D:/autostack/auto-ai at the worktree root, OR build from the main
# checkout. (The earlier `../../../../../../` form only worked inside `.worktrees/`
# because the extra level happened to line the depth up — it broke the main
# checkout, which is the canonical build location.)
auto-ai-client = { path = "../../../auto-ai/crates/auto-ai-client" }
ai-config = { path = "../../../auto-ai/crates/ai-config" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread"] }
thiserror = "1"
tracing = "0.1"
dirs = "5"
