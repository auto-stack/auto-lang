[package]
name = "shim-metadata"
version = "0.1.0"
edition = "2021"
# Plan 430: rustdoc 元信息工具 —— 签名提取 × 规律分类器 → shim 包生成。
# C2 起拆为 lib+bin:lib 供 auto-cache/auto-lang 的 dep 管线进程内调用
# (提取元信息 + 生成 shim 包),bin 保持离线 CLI 用法。

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "shim_metadata"
path = "src/lib.rs"

[[bin]]
name = "shim-metadata"
path = "src/main.rs"
