[package]
name = "auto-cosmic-ports-linux"
version = "0.1.0"
edition = "2021"
description = "Plan 365 W4: Linux port adapters (zbus/UPower) + cross-platform fallback"

[dependencies]
auto-cosmic-ports = { path = "../ports" }

# zbus is Linux-only (D-Bus). On Windows the `fallback` module re-exports the
# W2 mock impls, so this crate compiles everywhere; the real D-Bus adapters
# are only compiled on `target_os = "linux"`.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false }
