[package]
name = "auto-cosmic-host-libcosmic"
version = "0.1.0"
edition = "2021"
description = "Plan 365 W3: libcosmic host backend (VTree → libcosmic Element) + cross-platform fallback"

[dependencies]
# ui-headless gives us the fallback path (headless::run_headless) on non-Linux.
auto-lang = { path = "../../auto-lang", features = ["ui", "ui-headless"] }
auto-cosmic-ports = { path = "../ports" }

# libcosmic is Linux/Wayland-only. On Windows the `fallback` module delegates
# to the headless backend, so this crate compiles everywhere. The real
# VTree→Element lowering is in `src/linux.rs` (compiled only on Linux).
[target.'cfg(target_os = "linux")'.dependencies]
# Uncomment when wiring the real libcosmic lowering:
# libcosmic = { git = "https://github.com/pop-os/libcosmic.git" }
# iced = { version = "0.13", default-features = false, features = ["wayland"] }
