[package]
name = "auto-tool-client"
version = "0.1.0"
edition = "2021"

# PLAN-816 T-12（M816-A）：I-TOOL 真实客户端——经 auto-tool-execution
# owned 设施 spawn 真实工具宿主进程，以 auto-tool-protocol 单源帧/信封
# 通信：describe/validate_project 窄能力、版本/缺能力/字段错误具名负控、
# cancel 诚实语义（NotCancellable 透传）、请求 deadline（超时=owned 树
# 终止+收尸+reader 线程 join 后才返回）、控制流/日志流隔离（stdout 仅
# 帧，日志只在 stderr）。
# 闭包 = data(auto-tool-protocol/auto-project-model) + man-ecosystem
# (auto-tool-execution)，无 auto-ui-tools 静态链接、无 Man/lang/UI
# （777 域 man-ecosystem；闭包由 test/fixtures/modularity/
# tool-client-consumer/verify-deps.sh 钉住）。
# 发现/discovery（版本探测、PATH/安装 profile 搜索）归 T-04——本客户端
# 只接受显式工具路径，不做任何隐式兄弟仓/源码搜索。

[dependencies]
auto-tool-protocol = { path = "../auto-tool-protocol" }
auto-tool-execution = { path = "../auto-tool-execution" }
# validate_project 的请求类型（I-PROJECT 单源；wire codec 经 protocol 的
# WireRequest，本 crate 不重复声明请求结构）。
auto-project-model = { path = "../auto-project-model" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
