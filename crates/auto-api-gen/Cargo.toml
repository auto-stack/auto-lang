[package]
name = "auto-api-gen"
version = "0.1.0"
edition = "2021"
description = "API server/client generation core (PLAN-815 T-04): single-algorithm api_gen + rust_sidecar effect adapter + shared rust generation workspace layout, extracted from auto-man (owner: lang-service-adapter)"
license = "MIT"

[dependencies]
# PLAN-906: auto-web 依赖退役（vue/axum 生成归 auto_web 直连；本 crate 仅保留 tauri 腿）。
auto-generation-core = { path = "../auto-generation-core", version = "=0.1.0" }
# Language SDK single source (api/ast/compile/trans/config/http services).
auto-lang-core = { path = "../auto-lang-core" }
# rust_sidecar declaration single source (SidecarDecl parsing).
auto-project-model = { path = "../auto-project-model" }
auto-val = { path = "../auto-val" }
sha2 = "0.10"
toml = "0.8"
semver = "1"
regex = { workspace = true }
serde_json = { workspace = true }

[features]
# PLAN-906: test-http-e2e 转发随 auto-web 依赖退役（e2e 家族迁 lang-web-e2e 探针工程）。

[dev-dependencies]
blake3 = "1.5"
tempfile = { workspace = true }
serde = { workspace = true }
# plan734 fixture compile-check uses #[tauri::command] (same spec as auto-man).
tauri = { version = "2", default-features = false, features = ["test"] }
# PLAN-832 fresh-lock lever: tauri 2.12.5 needs the erased-serde prerelease;
# without this exact pin a fresh lock resolves stable 0.4.11 and the test/tool
# closure fails to build. Source has no direct erased-serde use.
erased-serde = "=0.4.0-rc.1"
