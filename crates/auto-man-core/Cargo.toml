[package]
name = "auto-man-core"
version = "0.1.0"
edition = "2021"
description = "PLAN-809: management/build-planning rules core — pac.at declaration normalization, target/link closure, source selection and build planning as pure rules over auto-val nodes; language execution, Git/FS observation and Builder execution stay in auto-man adapters"

[dependencies]
# 数据层：Node/Obj/AutoStr/Shared（规则输入输出本体，同 auto-project-model 边界）
auto-val = { path = "../auto-val" }
# Atom（to_atom 投影）——轻量 crate，auto-lang 只是再导出
auto-atom = { path = "../auto-atom" }
# Port.compiler 类型 = auto_toolchain_core::config::CompilerConfig（PLAN-805
# 已单源；Port 数据结构随 Target 迁入本 crate，编译器配置类型同身份继承）
auto-toolchain-core = { path = "../auto-toolchain-core" }
# ThemeDeclLite 轻声明（T-02 已落 project-model；pac_from_decl 的 theme{}
# 块解析产物复用同一形状，避免第二份定义）
auto-project-model = { path = "../auto-project-model" }
log = { workspace = true }
# 选择规则半的 skips glob 匹配（原 auto-man/dir.rs scan_dir_flat 同库）
glob-match = { workspace = true }

[lib]
name = "auto_man_core"
path = "src/lib.rs"
