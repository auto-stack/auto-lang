[package]
name = "auto-man"
version = "0.1.0"
edition = "2021"

[features]
# PLAN-729 T-06: 生成文件 handler 的实编 wire e2e（串行真 TCP；与 auto-lang
# 同名 feature 同语义）。
test-http-e2e = []

[dependencies]
auto-lang = { path = "../auto-lang", features = ["ui-iced"] }
# PLAN-780: light static project-model (probe adapter only — no
# production read path consumes it yet; see src/project_model_adapter.rs)
auto-project-model = { path = "../auto-project-model" }
regex = "1"
auto-val = { path = "../auto-val" }
# PLAN-795: pac.lock core (model/codec/verify) — lock.rs is the Target/Git
# adapter + compatibility facade delegating to this crate.
auto-package-lock = { path = "../auto-package-lock" }
# PLAN-800: resolved dependency view & module path resolution core —
# resolver.rs is the language adapter (ExecutionMode/pac.at scan/
# ModuleResolver trait) delegating to this crate.
auto-package-resolver = { path = "../auto-package-resolver" }
# PLAN-803: Man template/builder asset single source + pure scaffold path
# planning — asset.rs is the compat facade (Auto eval + file IO adapter)
# delegating to this crate.
auto-man-assets = { path = "../auto-man-assets" }
# PLAN-805: toolchain config model / flag mapping / command template core —
# builder/ninja/{config,mapper,templates}.rs are thin re-export facades over
# this crate; am.at loading (CompilerStore), PATH/disk/process resolution
# (CompilerResolver) and Ninja execution (NinjaBuilder) stay here.
auto-toolchain-core = { path = "../auto-toolchain-core" }
# PLAN-809: management/build-planning rules core — pac.rs/target.rs/dir.rs/
# port.rs/group.rs/node_ext.rs hold Pac (effect carrier) + extension traits
# (TargetEffects/DirEffects: transpile/scan/clean/FS) and delegate all pure
# declaration/selection/projection/closure rules to this crate (re-export
# keeps type identity).
auto-man-core = { path = "../auto-man-core" }
auto-gen = { path = "../auto-gen" }
auto-cache = { path = "../auto-cache" }  # Plan 082: AutoCache integration
blake3 = { workspace = true }  # Plan 134: File hashing utilities
# PLAN-792 R1-F01: 资源 hash 用 SHA-256（随包 verify.py 经 python hashlib 独立可校验）
sha2 = "0.10"

# Error handling
thiserror = { workspace = true }

# CLI
clap = { workspace = true }
rust-embed = { workspace = true }

# Utilities
tabled = { workspace = true }
simplelog = { workspace = true }
log = { workspace = true }
normalize-path = { workspace = true }
dialoguer = { workspace = true }
glob = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
colored = { workspace = true }
glob-match = { workspace = true }
encoding_rs = { workspace = true }
is_executable = { workspace = true }
base64 = "0.22"

# Serialization (Phase 1+)
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
indicatif = { workspace = true }
chrono = { workspace = true }  # Plan 082: Timestamp formatting

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
tempfile = { workspace = true }
# PLAN-803 V03/V04: 门面↔资源层字节对照与 exporter 测试直接消费资源 crate
auto-man-assets = { path = "../auto-man-assets" }
# PLAN-811 V-01: 媒体基础真消费方（与生成应用同形——绕过 auto-lang 闭包直接
# use auto_media_core::；plan811_media_consumers 的实编实跑面）。
auto-media-core = { path = "../auto-media-core" }

[lib]
name = "auto_man"
path = "src/lib.rs"

