[package]
name = "auto-project-model"
version = "0.1.0"
edition = "2021"
description = "Light static project-model for AutoLang pac.at declarations (PLAN-780 pilot): no compiler/VM/UI types"
license = "MIT"

[dependencies]
auto-atom = { path = "../auto-atom" }
auto-val = { path = "../auto-val" }
# PLAN-815 T-03: same-source wire codec for GenerationRequest, provided at
# the data owner so the tool protocol / tool host / clients never re-declare
# a parallel request structure (feature-gated: the base model stays JSON-free).
serde_json = { workspace = true, optional = true }

[features]
wire = ["dep:serde_json"]
