[package]
name = "auto-ui-compiler"
version = "0.1.0"
edition = "2021"
description = "UI compiler: AURA analysis/extraction, design tokens and the vue/jet/ark/rust generators, extracted from auto-lang (PLAN-814). Consumes the pure language SDK; its generated runtime/SDK import paths are a code-output contract owned here."
license = "MIT"
keywords = ["ui", "compiler", "codegen", "aura"]

[features]
# PLAN-814 R3-06：T-03 迁移残留 cfg 门归位（消除 unexpected_cfgs 与静默
# 桩臂）——`ui`=pac.at ui_config 装载实臂/生成器测试门（旧 auto-lang
# `ui` 组件面，上层 default 经转发恢复恒开）；`ui-headless`=headless
# 样式适配器门。二者均为空门（实现依赖恒在），纯编译面开关。
default = []
ui = []
ui-headless = []

[dependencies]
# PLAN-814 T-01/T-02 probe skeleton: the UI analysis/generator surface
# (aura/ui_gen/design_tokens validators + widget registry) migrates in T-03.
# The compiler may use the SDK; it must NOT be depended on by the SDK.
# PLAN-814 R3-03b：原 `features = ["ui-dialect"]`（SDK optional 边）删除——
# 文法经 UiGrammar 函数表装配（本 crate 直接依赖 auto-ui-dialect 单源，
# UiGrammarSource inventory 自注册）。
auto-lang-core = { path = "../auto-lang-core" }
# PLAN-814 R3-03b：UI 文法单源直连（函数表构造 + 装配自注册）。
auto-ui-dialect = { path = "../auto-ui-dialect" }
# PLAN-814 R3-03b：UiGrammarSource inventory submit（SDK 收集点机制）。
inventory = "0.3"
# PLAN-814 T-03 Batch 1：action_config 解析消费的轻前端 crate（与 SDK 同源）。
auto-atom = { path = "../auto-atom" }
auto-val = { path = "../auto-val", features = ["serde"] }
# PLAN-814 T-03 Batch 2：aura 诊断面（miette/thiserror）+ ui_gen 序列化。
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
toml = { workspace = true }
regex = "1"
walkdir = "2"

[dev-dependencies]
# PLAN-815 T-04 F-02: store_deps 回归测试随迁所需（原 auto-lang dev-dep）。
tempfile = { workspace = true }
# PLAN-814 T-03 Batch 1：lucide 表脚手架测试（node_modules 抽样核对）。
walkdir = "2"
serde_json = { workspace = true }
