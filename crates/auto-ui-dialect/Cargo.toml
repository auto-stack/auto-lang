[package]
name = "auto-ui-dialect"
version = "0.1.0"
edition = "2021"
description = "AutoLang UI declaration grammar (msg/model) single-source implementation over the light dialect port (PLAN-806; depends only on auto-parser-api's light closure — no auto-lang/Parser/VM/renderer)"

# PLAN-806: UI msg 与 model 声明文法正式外置。本 crate 是完整 msg/model
# 声明算法的单一份实现（自 auto-lang Parser::parse_msg_decl_inner /
# parse_model_block_inner / parse_model_field_annotations 逐字迁出，
# PLAN-806 T-01 D1-D7 冻结），经对象安全端口 dyn ParseContext 驱动：
# 游标/expect/checkpoint 经桥面走 Parser 同一实现，expr/type 委托核心
# 文法，不复制 Pratt/类型解析。默认 UI 生产路径（顶层 UiDialect 派发与
# widget/component/store 结构路径、import 新建 Parser 的默认装配）全部
# 委托到本实现；旧 Parser 公开方法 parse_msg_decl/parse_model_block 仅
# 薄兼容委托。
#
# 依赖闭包冻结（T-01 D1）：仅 auto-parser-api（其闭包 = auto-ast/
# auto-lex/auto-diagnostics + auto-val 轻层）。禁依赖 auto-lang 或复制
# Parser/模型/lexer——777 lang-core 域规则（.autoos/module-boundaries.toml）。
# 闭包由 test/fixtures/modularity/ui-declarations-consumer 钉住。

[dependencies]
auto-parser-api = { path = "../auto-parser-api" }

# PLAN-814 R3-03b：UI 文法依赖回归测试（86 项随迁自 auto-lang-core 的
# `ui-dialect` 门控测试）——真 Parser/方言派发/转译语料驱动。dev 边不进
# normal/build 闭包（PLAN-806 轻闭包钉住不变；777 规则只审 normal/build）。
[dev-dependencies]
auto-lang-core = { path = "../auto-lang-core" }
tempfile = { workspace = true }
