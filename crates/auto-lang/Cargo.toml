[package]
name = "auto-lang"
version = "0.2.0"
edition = "2021"
description = "Auto is a programming language for automations in various scenarios"
homepage = "https://gitee.com/auto-stack/auto-lang"
repository = "https://gitee.com/auto-stack/auto-lang"
readme = "README.md"
license = "MIT"
keywords = ["automation", "language", "scripting"]

[features]
# Plan 330 曾把 ui-iced 定为非默认 heavy optional backend——2026-09-22 用户
# 裁定推翻：UI 约占本 crate ~52%（约30万/58万行；2026-09-22 cat 口径复核，原
# ~90% 注释系分母测量误差，PLAN-691 勘误），ui-iced 事实上是本体
# 而非可选件，全档（t/tf/tv/tt/tb/taa/ta/t3 + 裸 cargo check/test）经 default
# 统一同源 feature 集，消除档间切换的整库冷重编（Plan 507"tf 不带 ui-iced"
# 保守残留随之作废）。python 维持可选（auto bin default 仍自带）。拆仓
# （Design 32）落地后按新 crate 边界重新分档。
# PLAN-841：default 不再隐式装配 UI 文法；UI 消费方通过领域端口显式
# 组合 auto-ui-dialect，Core Parser 和 UI 文法的所有权保持分离。
# PLAN-900（Design 52 §2.1）：UI 栈整体迁 auto-ui 仓——本 crate 零 auto-ui
# 依赖，default = []；ui/ui-iced 等 16 个 UI 转发 feature 全删（auto-ui 侧
# 同名 feature 才是真身）。
# PLAN-901（Design 52 §2.2 计划B）：七个语言测试 feature
# （test-trans/test-cases/test-ace/test-book/test-aavm/test-http-e2e/
# test-case-batch）拍平退役——测试代码在同一 Cargo 测试编译形态可见，
# 运行范围由固定组/nextest 过滤/原 ignore/平台/环境条件决定；
# auto-test-case 转常驻依赖。with-file-history/use-evaluator 死 feature
# 同步退出（crates 内零 cfg 命中、无外部请求者）。
default = []
# Plan 565 P0: feature-gated counting global allocator (memory attribution).
# Zero cost when off — the System allocator stays in place; when on, lib.rs
# installs CountingAlloc as #[global_allocator] (lock-free AtomicU64 stats).
mem-profile = ["auto-lang-core/mem-profile"]
# Plan 289: Examples are opt-in to avoid 23 linker processes consuming ~46GB memory
build-examples = []
# Plan 081: AutoVM is now the default execution engine (no feature flag required)
# AutoVM is always enabled. Use AUTO_EXECUTION_ENGINE=evaluator to select
# the TreeWalker evaluator for debugging or comparison.
# Plan 152: SSE parsing + advanced streaming support (futures now unconditional per Plan 341)
streaming-http = ["tokio-util", "auto-lang-core/streaming-http"]

# Plan 413: code editor（PLAN-900 后单 owner——SDK a2r diff 双轨门
# auto-lang-core/code-editor；runtime editor 注册表/provider 臂归
# auto-ui-runtime/code-editor，本 crate 只保留 SDK 转发）。
code-editor = ["auto-lang-core/code-editor"]

# Plan 214: Python FFI (embed CPython via PyO3)
python = ["pyo3", "auto-lang-core/python"]

# PLAN-900：UI feature 族（ui/ui-iced/ui-interpreter/ui-headless/
# image-pipeline/highlight-treesitter/ui-clipboard/ui-dialog/
# iced-layout-tests/native-dock/native-clipboard/native-dnd/autodown/
# test-native-dock/mpv-*）整体迁 auto-ui 仓——真身在 auto-ui-runtime。
# PLAN-900：UI feature 族（ui/ui-iced/ui-interpreter/ui-headless/
# image-pipeline/highlight-treesitter/ui-clipboard/ui-dialog/
# iced-layout-tests/native-dock/native-clipboard/native-dnd/autodown/
# test-native-dock/mpv-*）整体迁 auto-ui 仓——真身在 auto-ui-runtime。

[dependencies]
auto-web = { path="../../../auto-web/crates/auto-web", version="=0.1.0" }
# PLAN-814: SDK/UI 包组拆分——旧 auto-lang 转为上层兼容/默认组合层，依赖
# 三个新包（机制切片：use_scanner 已迁 auto-lang-core，旧路径经 lib.rs
# 再导出保类型身份；UI compiler/runtime 迁移面见 T-03/T-04）。
auto-lang-core = { path = "../auto-lang-core" }
# Plan 673 T-03：read_text_range 分块读 VM/a2r-std 双轨逐字节对拍
# （P670-D1 纪律：两侧 serde 形状一致，测试断言 byte-identical）。
# PLAN-681：升为正式依赖——迷你库 a2r_std::fs 的 tree/basename re-export
# 宿主在独立 a2r-std crate（生成物两种拼写单一实现源；对拍测试钉形状）。
a2r-std = { path = "../a2r-std" }
auto-val = { path = "../auto-val", features = ["serde"] }
auto-atom = { path = "../auto-atom" }
# PLAN-789: 词法基础单一来源（Token/Lexer）；token/lexer 模块为薄 re-export。
auto-lex = { path = "../auto-lex" }
# PLAN-793: 诊断基础单一来源（AutoError 聚合 + 各族诊断 + source attach/
# 格式化）；error 模块为薄 re-export 门面，error→ast 边已切断。
auto-diagnostics = { path = "../auto-diagnostics" }
# PLAN-799: AST model single source (Code/Stmt/Expr/Type/UI-compat nodes +
# ToNode/ToAtom/AtomWriter); the ast module is a thin re-export facade.
auto-ast = { path = "../auto-ast" }
# PLAN-801: 方言端口 API 单一来源（轻 CompilerSession/Scenario +
# ExternalDialect + 对象安全 ParseContext）；session/DialectPriority 为薄
# re-export 门面，ParserBridge 实现端口并经 adapter 进同一三段派发表。
auto-parser-api = { path = "../auto-parser-api" }
auto-cache = { path = "../auto-cache" }
# Plan 430 C2: dep 管线进程内调用 shim 包生成器 + manifest 结构
shim-metadata = { path = "../shim-metadata" }
# Plan 768: TestCase protocol core (adapters live here; dependency direction
# auto-lang -> auto-test-case only). Gated behind the empty `test-cases`
# feature so no-default/GUI-free builds can opt in.
# PLAN-901：TestCase 协议核心转常驻依赖（原 optional + test-cases feature
# 门拍平；auto-case/ace-certify/test-case-pilot 三 bin 默认即真实形态）。
auto-test-case = { path = "../auto-test-case" }
# Plan 216: C FFI Bindgen manifest types
auto-bindgen = { path = "../auto-bindgen" }
# PLAN-808: terminal host-domain core — owned cells/geometry contract, runtime
# autoterm_core.dll service and the 34-method TerminalHostProvider port. The
# crate has no auto-lang/UI/auto-man/auto-term Cargo edge.
auto-terminal-core = { path = "../auto-terminal-core" }
rustyline = { workspace = true, features = ["with-file-history"] }
strum = { workspace = true }
strum_macros = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# PLAN-703 T-00: diff engine core — histogram algorithm (git port, optimized;
# Myers fallback for pathological repetition keeps worst-case linear). 0.2.0
# API: Diff::compute_with over caller-interned token arrays (we intern line
# &str by first occurrence ourselves — no interner copy, full determinism
# control). unified_diff feature off (we build envelope rows ourselves).
# License Apache-2.0; deps hashbrown+memchr only (T-00 decision record).
# PLAN-807: text foundation (rope/paging/snapshot/diff incl. the imara-diff
# histogram core) — the editor kernel, diff facades and VM/a2r consumers all
# use this single source; the old ui/code_editor/core/rope +
# ui/code_editor/diff paths are thin re-exports (imara-diff itself is no
# longer a direct dependency here).
auto-text-core = { path = "../auto-text-core" }
# PLAN-811: media foundation (image asset pipeline data plane/runtime + local
# media file service), extracted verbatim from this crate's ui/
# {image_pipeline,media_service}; those paths are thin re-exports.
# Unconditional because the media file service (blake3-only) stays ungated;
# the codec lane rides the image-pipeline feature.
auto-media-core = { path = "../auto-media-core", default-features = false }
toml = { workspace = true }      # Plan 342: block spec.md frontmatter
ecow = { workspace = true }
normalize-path = { workspace = true }
roxmltree = { workspace = true }
dirs = { workspace = true }
lazy_static = "1.4"
inventory = "0.3"
thiserror = { workspace = true }
miette = { workspace = true }
regex = "1"
auto-macros = { path = "../auto-macros" }
dashmap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
blake3 = { workspace = true }
bincode = { workspace = true }
# Plan 081 Phase 5: Dynamic library loading for C/Rust FFI
libloading = "0.8"
# Logging for FFI bridge
log = { workspace = true }
# URL encoding (Plan 102)
urlencoding = { workspace = true }
# Plan 199 Phase 7: Colored output for debugger
colored = { workspace = true }
sysinfo = { workspace = true }

# Plan 154/341: HTTP client — blocking (Plan 154) + async + stream (Plan 341 异步客户端/SSE)
# Plan 391 (W4): +brotli response decompression.
reqwest = { version = "0.12", features = ["blocking", "json", "stream", "multipart", "cookies", "gzip", "brotli"] }
# Plan 350: WebSocket client (sync, runs on dedicated thread)
tungstenite = { version = "0.24", features = ["native-tls"] }
# Plan 159: Directory walking for AutoCode agent
walkdir = "2"
# Plan 212 Phase 2.2: Opaque struct shims
url = "2"
semver = "1"
# Plan 212 Phase 2.3: Additional opaque struct shims
chrono = "0.4"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
mime_guess = "2"
csv = "1.3"
# Plan 267 Phase B: TarGzip multi-crate composition
tar = "0.4"
flate2 = "1"
# Plan 267 Phase C: same_file handle comparison
same-file = "1"
ansi_term = "0.12"
# Plan 152/341: SSE 解析 + 异步流式（Plan 341 异步客户端需要 StreamExt）
tokio-util = { version = "0.7", features = ["io"], optional = true }
futures = "0.3"

# Plan 299: Streamable HTTP transport for AutoUI MCP server.
# PLAN-699 T-03: no longer optional — the VM `#[api]` server's HTTP/1.1
# transport is Axum/Hyper now (network layer), so it must compile in every
# feature shape instead of riding on ui-interpreter implicitly.
axum = { version = "0.8", features = ["json"] }
# PLAN-699 T-01 spike: the VM server drives hyper-util's auto connection
# builder directly (max_buf_size / header_read_timeout / graceful shutdown
# are not exposed through axum::serve). hyper is direct only for
# hyper::upgrade::on (raw WebSocket echo port).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service"] }
# PLAN-781 T-22（W-04/F-781-R04）：transport 影子句柄 RST 断连侦测
# （SockRef::try_clone + MSG_PEEK；std set_linger 未稳定供测试侧用）。
# 版本沿用 lock 内既有 0.5.x（tokio 栈传递依赖），不新增拷贝。
socket2 = "0.5"
# Plan 214: Python FFI (optional, requires Python dev headers)
pyo3 = { version = "0.29", optional = true, features = ["auto-initialize"] }
trans = "0.4.0"
# Plan 173: r2a transpiler (Rust → Auto)
syn = { version = "2", features = ["full", "parsing", "printing"] }
fastrand = "2.4.1"
stacker = "0.1.25"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }

# Plan 473: native window dock Win32 adapter（发现/几何/样式/层级/WinEventHook）。
# optional + cfg(windows) 双门控：仅 Windows × native-dock feature（ui-iced 隐含）
# 时编译；版本取 0.58（Cargo.lock 已有，零新增外部版本）。
# Plan 485: features 增 DataExchange(剪贴板)/Shell(DragQueryFileW)/Memory
# (GlobalAlloc 系)——native-clipboard 与 native-dock 共用本条目。
# Plan 485 T9: 增 Security——CreateMutexW 签名引用 SECURITY_ATTRIBUTES
# (跨进程命名互斥,串行化剪贴板集成测试防 nextest 多进程并行互清)。
[target.'cfg(windows)'.dependencies]

[dev-dependencies]
auto-tool-execution = { path = "../auto-tool-execution" }
# 示例直接使用 iced::daemon/application；版本与 auto-ui-runtime 锁定同源。

# PLAN-619 §8.5 回归锚用：把 lucide 文档栅格化后断言 ink 充满度=几何值。
# 两者已在依赖图中（经 iced_wgpu），此处只作测试期直接依赖。
resvg = "0.45"
tiny-skia = "0.11"
criterion = "0.5"
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
# PLAN-814 T-07：测试期 UI 依赖随 owner 迁 auto-ui-runtime 清零（T-04 临时
# dev-deps 兜住形态收口；残留 UI 测试仅经 auto_lang:: 再导出消费=V-02 兼容面）。

# PLAN-634 T-01：terminal 像素金样稳健比对（容差像素差分）。版本随
# iced_test（其 matches_image 即用 png 落盘/读盘），不新增编译单元。
png = "0.18"

[[bench]]
name = "incremental_transpile_bench"
harness = false

# ============================================================================
# Integration tests
# ============================================================================

# ============================================================================
# Examples（PLAN-900：28 个 UI examples 迁 auto-ui-runtime/examples；仅剩
# a2r_step*/run_vm_test 4 个非 UI 项，仍走 build-examples 门）
# ============================================================================

[[example]]
name = "run_vm_test"
path = "examples/run_vm_test.rs"
required-features = ["build-examples"]

[[example]]
name = "a2r_step02"
path = "examples/a2r_step02.rs"
required-features = ["build-examples"]

[[example]]
name = "a2r_step03"
path = "examples/a2r_step03.rs"
required-features = ["build-examples"]

[[example]]
name = "a2r_step04"
path = "examples/a2r_step04.rs"
required-features = ["build-examples"]

