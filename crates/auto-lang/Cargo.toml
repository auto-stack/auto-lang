[package]
name = "auto-lang"
version = "0.1.0"
edition = "2021"
description = "Auto is a programming language for automations in various scenarios"
homepage = "https://gitee.com/auto-stack/auto-lang"
repository = "https://gitee.com/auto-stack/auto-lang"
readme = "README.md"
license = "MIT"
keywords = ["automation", "language", "scripting"]

[features]
# Plan 330: ui-iced and python are heavy optional backends — no longer default.
# Consumers opt in explicitly (auto via its own default; auto-man via features).
default = ["with-file-history"]
# Plan 289: Feature-gated test groups for faster daily development
test-vm-files = []
test-trans = []
test-book = []
# Plan 317 §11 Phase 11: HTTP e2e tests (start real TCP servers; run serially).
# Off by default — enables `plan326_tests::http_e2e` submodule (the 7 former
# `#[ignore]` e2e tests). CI runs them in `.github/workflows/http-e2e-ci.yml`.
test-http-e2e = []
# Plan 289: Examples are opt-in to avoid 23 linker processes consuming ~46GB memory
build-examples = []
with-file-history = []
# Plan 081: AutoVM is now the default execution engine (no feature flag required)
# DEPRECATED: The use-bigvm feature is kept for compatibility but has no effect
# AutoVM is always enabled. Use environment variable AUTO_EXECUTION_ENGINE=evaluator
# to switch to the TreeWalker evaluator for debugging/comparison.
use-bigvm = []
# Fallback to TreeWalker evaluator (for debugging/comparison)
use-evaluator = []
# Plan 152: SSE parsing + advanced streaming support (futures now unconditional per Plan 341)
streaming-http = ["tokio-util"]

# Plan 214: Python FFI (embed CPython via PyO3)
python = ["pyo3"]

# Plan 015: UI Features (AutoUI Core)
ui = []
ui-interpreter = ["ui", "dep:ureq", "dep:axum"]
ui-headless = ["ui", "ui-interpreter"]
ui-gpui = ["ui", "dep:gpui-lib", "dep:gpui-component", "dep:anyhow"]
ui-iced = ["ui", "dep:iced", "dep:iced_widget", "dep:iced_futures", "ui-interpreter", "dep:image", "dep:arboard", "code-editor", "ui-clipboard", "ui-dialog", "native-dock", "native-clipboard"]
# Plan 413: cross-platform code editor widget (cosmic-text ViEditor engine,
# syntect/two-face highlighting). Mounted under ui-iced — enabling the iced
# backend brings the editor along.
code-editor = ["ui", "dep:cosmic-text", "dep:syntect", "dep:two-face"]
# Plan 418: OS clipboard natives (arboard) + native file dialogs (rfd).
# Both mount under ui-iced; each can also be enabled standalone.
ui-clipboard = ["dep:arboard"]
# raw-window-handle: rfd::FileDialog::set_parent takes HasWindowHandle +
# HasDisplayHandle (rwh 0.6 — same instance iced already locks) — used to
# parent the blocking dialogs to the app's main window (Plan 428 debt fix).
ui-dialog = ["dep:rfd", "dep:raw-window-handle"]
# Plan 414 §8.2 follow-up: headless iced layout testbench (iced_test) —
# offline bounds assertions for the VM Row/layout bug matrix.
iced-layout-tests = ["ui-iced", "dep:iced_test"]
# Plan 019 批次七: autodown-core crate 消费（VM markdown/autodown widget 真渲染
# —— parse_blocks → 面板树 → iced View）。跨仓 path 依赖指向 auto-down 主检出的
# crate（两仓 plan-019 分支已互联合入：auto-down bd8d16e / auto-lang 1c80b8cf5）。
# ui-iced: 面板适配落在 aura_view_builder（ui-interpreter 门控），其测试
# 与 mcp 链路依赖 iced 后端（iced_adapter/编码）。
autodown = ["ui-iced", "dep:autodown-core"]

# Plan 473: 原生窗口 dock（假洞 Phase 1）——Win32 适配层。windows dep 为
# optional + target 门控：仅 Windows × ui-iced（隐含 native-dock）时实际编译，
# 默认档构建零开销；非 Windows 走同名 no-op 模块。
native-dock = ["dep:windows"]
# Plan 485: 原生剪贴板 Phase 2——文件(CF_HDROP)/图片(CF_DIBV5+"PNG")桥，
# Win32 调用仅出现在 ui/clipboard_native.rs。与 native-dock 同型双门控
# （optional dep + cfg(windows)；ui-iced 隐含启用）。windows dep 的 features
# 列表与 native-dock 共用一条目——Cargo feature 合并语义下扩列即两 feature
# 共用（Plan 485 待澄清#4 定稿：合并扩列，编译最小扰动）。
native-clipboard = ["dep:windows", "dep:image"]
# Plan 488: 原生互操作 Phase 3——OLE 拖放双向（IDataObject/IDropSource/
# IDropTarget 自实现 + DoDragDrop STA 线程 + 虚拟文件 FILEDESCRIPTOR/
# FILECONTENTS）。Win32/COM 调用仅出现在 ui/native_dnd.rs，与 native-dock
# 同型双门控（optional dep + cfg(windows)）；不隐含 ui-iced（G5：未开
# feature 时 natives 降级返 false）。
# windows-core 直接依赖：#[implement] 宏展开引用 ::windows_core:: 绝对路径，
# 传递依赖不可见（488 步骤 2 spike 发现）。image：拖入 CF_DIB/PNG → 临时
# PNG 落盘转换（485 同源用法，零新增版本）。
native-dnd = ["dep:windows", "dep:windows-core", "dep:image"]
# Plan 473: T2/T3 真窗口 Win32 集成 / fixture E2E 测试门控（对齐
# test-vm-files 命名法）；隐含 ui-iced + native-dock，`cargo t` 日常档不含。
test-native-dock = ["ui-iced", "native-dock"]

[dependencies]
auto-val = { path = "../auto-val" }
auto-atom = { path = "../auto-atom" }
auto-cache = { path = "../auto-cache" }
# Plan 430 C2: dep 管线进程内调用 shim 包生成器 + manifest 结构
shim-metadata = { path = "../shim-metadata" }
# Plan 019 批次七: autodown-core（markdown parser/serializer/块模型 a2r 发射，
# 见特性 autodown 注释——跨仓 path 指向 auto-down 主检出 crate）。
autodown-core = { path = "../../../auto-down/autodown/packages/engine/rust", optional = true }
# Plan 216: C FFI Bindgen manifest types
auto-bindgen = { path = "../auto-bindgen" }
rustyline = { workspace = true, features = ["with-file-history"] }
strum = { workspace = true }
strum_macros = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }      # Plan 342: block spec.md frontmatter
ecow = { workspace = true }
normalize-path = { workspace = true }
roxmltree = { workspace = true }
dirs = { workspace = true }
lazy_static = "1.4"
inventory = "0.3"
thiserror = { workspace = true }
miette = { workspace = true }
regex = "1"
auto-macros = { path = "../auto-macros" }
dashmap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
blake3 = { workspace = true }
bincode = { workspace = true }
# Plan 081 Phase 5: Dynamic library loading for C/Rust FFI
libloading = "0.8"
# Logging for FFI bridge
log = { workspace = true }
# URL encoding (Plan 102)
urlencoding = { workspace = true }
# Plan 199 Phase 7: Colored output for debugger
colored = { workspace = true }

# Plan 154/341: HTTP client — blocking (Plan 154) + async + stream (Plan 341 异步客户端/SSE)
# Plan 391 (W4): +brotli response decompression.
reqwest = { version = "0.12", features = ["blocking", "json", "stream", "multipart", "cookies", "gzip", "brotli"] }
# Plan 350: WebSocket client (sync, runs on dedicated thread)
tungstenite = { version = "0.24", features = ["native-tls"] }
# Plan 159: Directory walking for AutoCode agent
walkdir = "2"
# Plan 212 Phase 2.2: Opaque struct shims
url = "2"
semver = "1"
# Plan 212 Phase 2.3: Additional opaque struct shims
chrono = "0.4"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
mime_guess = "2"
csv = "1.3"
# Plan 267 Phase B: TarGzip multi-crate composition
tar = "0.4"
flate2 = "1"
# Plan 267 Phase C: same_file handle comparison
same-file = "1"
ansi_term = "0.12"
# Plan 152/341: SSE 解析 + 异步流式（Plan 341 异步客户端需要 StreamExt）
tokio-util = { version = "0.7", features = ["io"], optional = true }
futures = "0.3"

# Plan 015: UI Backend dependencies (optional)
gpui-lib = { version = "0.2.2", package = "gpui", optional = true }
gpui-component = { version = "0.5.0", optional = true }
anyhow = { version = "1.0", optional = true }
iced = { version = "0.14.0", features = ["tokio", "image", "svg", "advanced", "canvas"], optional = true }
# Plan 057 (ash-gui 光标可见): text_editor 的 highlighter 类型(PlainText/Format)
# 未经 iced facade 公开导出,直接依赖 iced_widget(与 iced 0.14 同版本系)。
iced_widget = { version = "0.14", optional = true }
# Plan 459: 自定义 Recipe/per-App 订阅需要 subscription::filter_map 的可捕获闭包
# （iced facade 未 re-export subscription 自由函数）。与 iced 同版本系。
iced_futures = { version = "0.14", optional = true }
# Plan 414 §8.2: headless layout testbench — normal optional dep (Cargo
# forbids optional dev-deps); only linked when `iced-layout-tests` is on.
iced_test = { version = "0.14", optional = true }
# Plan 411: preview-card copy button (clipboard) — gated behind ui-iced with the renderer.
arboard = { version = "3", optional = true }
# Plan 418: native open/save file dialogs (sync API) behind `ui-dialog`.
rfd = { version = "0.15", optional = true }
# Plan 428 debt fix: parent those dialogs to the main window (rwh 0.6 —
# version-locked with rfd/iced so the handle traits line up).
raw-window-handle = { version = "0.6", optional = true }
image = { version = "0.25", optional = true }
# Plan 413: code editor engine. cosmic-text MUST stay on the same minor as
# iced 0.14.0's pin (0.15) — a second copy would break the Weak<Buffer>
# handoff into fill_raw. syntect/two-face unify to a single 5.x instance.
cosmic-text = { version = "0.15", optional = true, features = ["vi", "syntect"] }
syntect = { version = "5", optional = true }
two-face = { version = "0.4", optional = true }
notify = { workspace = true }
ureq = { version = "2", features = ["json"], optional = true }
# Plan 299: Streamable HTTP transport for AutoUI MCP server
axum = { version = "0.8", features = ["json"], optional = true }
# Plan 214: Python FFI (optional, requires Python dev headers)
pyo3 = { version = "0.29", optional = true, features = ["auto-initialize"] }
trans = "0.4.0"
# Plan 173: r2a transpiler (Rust → Auto)
syn = { version = "2", features = ["full", "parsing", "printing"] }
fastrand = "2.4.1"
stacker = "0.1.25"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }

# Plan 473: native window dock Win32 adapter（发现/几何/样式/层级/WinEventHook）。
# optional + cfg(windows) 双门控：仅 Windows × native-dock feature（ui-iced 隐含）
# 时编译；版本取 0.58（Cargo.lock 已有，零新增外部版本）。
# Plan 485: features 增 DataExchange(剪贴板)/Shell(DragQueryFileW)/Memory
# (GlobalAlloc 系)——native-clipboard 与 native-dock 共用本条目。
# Plan 485 T9: 增 Security——CreateMutexW 签名引用 SECURITY_ATTRIBUTES
# (跨进程命名互斥,串行化剪贴板集成测试防 nextest 多进程并行互清)。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # Plan 515 D1：HICON 真图标提取（GetIconInfo + GetDIBits 位图 → RGBA）。
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_UI_Shell",
    "Win32_System_Memory",
    "Win32_Security",
    # Plan 486 T4：合成拖拽 SendInput（test-native-dock 档独占使用；
    # feature 列与 native-dock/native-clipboard 共用条目——Cargo 合并语义）。
    "Win32_UI_Input_KeyboardAndMouse",
    # Plan 488: OLE 拖放——Com(OLE 基础/DoDragDrop/OleInitialize)+
    # Ole(IDataObject/IDropSource/IDropTarget/STGMEDIUM/FORMATETC)+
    # implement(#[implement] 宏与 *_Impl trait 的 include 门)+
    # SystemServices(MODIFIERKEYS_FLAGS——DragEnter/Over/Drop 签名)+
    # Graphics_Gdi+Com_StructuredStorage(IDataObject_Impl/FORMATETC 全签名的
    # cfg 门)。后三组为 implement 宏的传递性必需（485 T9 增 Security 同型）。
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    # Plan 488 T6 修：拖入目标跨线程 marshal（专用 STA 线程持对象）。
    "Win32_System_Com_Marshal",
    "implement",
] }
# Plan 488: #[implement] 宏的展开物引用 ::windows_core:: 绝对路径——需直接
# 依赖（版本与 windows 0.58 配套）。仅在 Windows 目标编译。
windows-core = { version = "0.58", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
insta = { version = "1", features = ["yaml"] }

[[bench]]
name = "incremental_transpile_bench"
harness = false

