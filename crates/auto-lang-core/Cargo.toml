[package]
name = "auto-lang-core"
version = "0.1.0"
edition = "2021"
description = "Pure language SDK: the single source for the non-UI language stack (scanner/parser/type/compile/VM/trans core), extracted from auto-lang (PLAN-814). Its normal/build/dev closure must not contain UI implementations (generators/renderer/desktop host) or Man."
license = "MIT"
keywords = ["language", "sdk", "parser", "vm", "transpiler"]

[dependencies]
# PLAN-814 T-02 前端门面组闭包（ast/token/error/session/lexer 直连外部轻
# crate；symbols/scope/scope_manager 另需 auto-val/ecow）。
auto-ast = { path = "../auto-ast" }
auto-lex = { path = "../auto-lex" }
auto-diagnostics = { path = "../auto-diagnostics" }
auto-parser-api = { path = "../auto-parser-api" }
auto-val = { path = "../auto-val", features = ["serde"] }
ecow = { workspace = true }

[dev-dependencies]
