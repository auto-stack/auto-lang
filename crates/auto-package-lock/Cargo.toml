[package]
name = "auto-package-lock"
version = "0.1.0"
edition = "2021"
description = "pac.lock core: lock model, TOML/JSON codec and dependency verification rules, extracted Target-free from auto-man (PLAN-795)"
license = "Proprietary"
keywords = ["automation", "package-manager", "lockfile"]

[dependencies]
# AutoPath keeps the codec's path semantics (unified display/format
# selection) byte-identical to the historical auto-man implementation.
# auto-val is a leaf data crate — the lock core must NOT depend on
# auto-lang/auto-man or any interpreter/build stack (pinned by
# test/fixtures/modularity/package-lock-consumer).
auto-val = { path = "../auto-val" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
