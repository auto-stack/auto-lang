[package]
name = "auto-gen"
version = "0.1.0"
edition = "2021"
description = "AutoGen is a automatic code generater, supporting generation of JSON/C/Rust/"
homepage = "https://gitee.com/auto-stack/auto-gen"
repository = "https://gitee.com/auto-stack/auto-gen"
readme = "README.md"
license = "Proprietary"
keywords = ["automation", "language", "code generation"]

[[bin]]
name = "autogen"
path = "src/bin/autogen.rs"

[dependencies]
clap = { workspace = true }
# PLAN-814 T-06：非 UI 消费者切 SDK（atom/interpreter/ast 全为 Core 面；
# 旧 default 拖 ui-iced 闭包的形态就此关闭——V-01 纯消费证明）。
auto-lang-core = { path = "../auto-lang-core" }
# PLAN-791: single definition of guard/error/report types and the output
# orchestration; this crate stays the Auto executable-template adapter.
auto-gen-core = { path = "../auto-gen-core" }
auto-val = { path = "../auto-val" }
miette = { workspace = true }
notify = { version = "7.0", optional = true }

[features]
default = []
watch = ["notify"]

[dev-dependencies]
# PLAN-791 V02/V03 frozen-behavior suites need hermetic output dirs.
tempfile = { workspace = true }
