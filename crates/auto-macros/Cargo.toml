[package]
name = "auto-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
inventory = "0.3.22"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
# PLAN-814 R3-03：dev 面改依纯 SDK——消除指向旧巨包的 manifest 链
# （无 UI checkout 的源码消费需要 auto-macros 可独立解析）。
auto-lang-core = { path = "../auto-lang-core" }
auto-val = { path = "../auto-val" }
