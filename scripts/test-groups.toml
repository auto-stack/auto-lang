# PLAN-896: fixed Cargo packages/Rust mod subtrees; no per-test or leaf catalog.
# PLAN-1016 / 2026-11-12 user ruling: ordinary ACE package groups exclude
# formal performance/scale campaigns; run those explicitly via ace-perf.
# Their original samples, assertions, ignore/platform and resource rules remain.
schema = 1
default = ["daily"]

[sets]
ace = ["ace-workspace", "ace-adapters", "ace-batch"]

[[group]]
name = "daily"
title = "原日常范围（无参数）"
runner = "nextest"
workspace = "."
# PLAN-900：schema_drift/docs_gen/component_registry_test 三集成目标随
# UI 域迁 auto-ui-runtime/tests（其断言面=auto-ui 代码 + auto-lang docs
# 语料跨仓读取）；daily 收敛回 --lib 面。
args = ["-p", "auto-lang", "-p", "auto-lang-core", "--lib"]
# PLAN-901：测试 feature 拍平后，原靠 feature 缺席隐藏的转译/书稿/HTTP e2e/
# ACE 桥接测试族常驻可见——静态边界钉住原日常范围（与 profile.default 的
# default-filter 语义叠加）。
# PLAN-1014 T-03：原枚举式前缀清单漏掉 7 个后加模块（abi::source_protocol_tests、
# ac_av::resource_915_tests/resource_events/worker_json_tests、ac_mn::refusal_tests/
# resource_events/source_diag_tests 等 58 例），legacy 守卫持续红。改为族式排除
# `test_cases::(ac|abi|sema|ace_)`——与 ace-adapters 的正向选择同构、与
# run_rust 守卫前缀一致，新 ACE 模块自动划归显式 ACE 职责组，不再靠手工清单。
expression = "not(test(/^(?:test_cases::ac|test_cases::abi::|test_cases::sema::|test_cases::ace_|tests::a2r_tests::|tests::a2ts_tests::|tests::book_listing_tests::|tests::plan724_http_client_tests::e2e::|tests::plan727_http_transfer_tests::e2e::)/))"
tools = []
domain = "legacy"
all = false

[[group]]
name = "lexer"
title = "词法完整包"
runner = "nextest"
workspace = "."
args = ["-p", "auto-lex", "--lib", "--tests"]
expression = "all()"
tools = []
domain = "legacy"
all = false

[[group]]
name = "parser"
title = "解析及语法集成"
runner = "nextest"
workspace = "."
args = ["-p", "auto-lang", "-p", "auto-lang-core", "--lib", "--config-file", ".config/nextest-full.toml"]
expression = "test(/^parser::/) or test(/^ast_parse_ext::/) or test(/^tests::(plan_088_parser_tests|test_parser_arrow|test_generic_parse|plan442_parser_regress_tests|plan789_lex_extraction)::/)"
tools = []
domain = "legacy"
all = false

[[group]]
name = "infer"
title = "类型推导"
runner = "nextest"
workspace = "."
args = ["-p", "auto-lang", "-p", "auto-lang-core", "--lib", "--config-file", ".config/nextest-full.toml"]
expression = "test(/^(infer|typeck|types|trait_checker|type_registry)::/) or test(/^tests::(infer_tests|generic_spec_tests|generic_tests|const_generic_tests|const_generic_integration_tests|monomorphize_tests)::/)"
tools = []
