# PLAN-896: fixed Cargo packages/Rust mod subtrees; no per-test or leaf catalog.
schema = 1
default = ["daily"]

[sets]
ace = ["ace-workspace", "ace-adapters", "ace-batch"]

[[group]]
name = "daily"
title = "原日常范围（无参数）"
runner = "nextest"
workspace = "."
args = ["-p", "auto-lang", "-p", "auto-lang-core", "--lib", "--test", "schema_drift", "--test", "docs_gen", "--test", "component_registry_test", "--features", "auto-lang/test-cases"]
expression = "all()"
tools = []
domain = "legacy"
all = false

[[group]]
name = "lexer"
title = "词法完整包"
runner = "nextest"
workspace = "."
args = ["-p", "auto-lex", "--lib", "--tests"]
expression = "all()"
tools = []
domain = "legacy"
all = false

[[group]]
name = "parser"
title = "解析及语法集成"
runner = "nextest"
workspace = "."
args = ["-p", "auto-lang", "-p", "auto-lang-core", "--lib", "--features", "auto-lang/test-cases,auto-lang/test-trans,auto-lang/test-book,auto-lang/test-http-e2e", "--config-file", ".config/nextest-full.toml"]
expression = "test(/^parser::/) or test(/^ast_parse_ext::/) or test(/^tests::(plan_088_parser_tests|test_parser_arrow|test_generic_parse|plan442_parser_regress_tests|plan634_block_tail_semi_tests|plan789_lex_extraction)::/)"
tools = []
domain = "legacy"
all = false

