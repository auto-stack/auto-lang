[workspace]
members = [
    "011-calculator",
    "012-stopwatch",
    "013-todo",
    "013-todo-back",
    "014-weather",
    "015-notes",
    "015-notes-back",
    "016-calendar",
    "017-chat-back",
    "ash-gui-auto-back",
    "auto-musk-041debt-back",
    "auto-musk-041t20-back",
    "auto-musk-back",
    "auto-musk-dev-1-back",
    "auto-musk-dev-2-back",
    "auto-musk-p037-back",
    "auto-musk-p038-back",
    "auto-musk-wt029-back",
    "contact-form",
    "converter",
    "counter",
    "hero-section",
    "login",
    "musk-verify-fresh-back",
    "myapp-back",
    "plan-032-back",
    "plan-047-dev-back",
    "plan-048-dev-back",
    "plan-049-dev-back",
    "plan-050-dev-back",
    "plan-051-dev-back",
    "plan-052-dev-back",
    "plan-053-dev-back",
    "plan-055-dev-back",
    "plan-056-dev-back",
    "plan-057-dev-back",
    "plan-058-dev-back",
    "poc-hello-back",
    "pricing-table",
    "profile-card",
    "stats-board"
]
resolver = "2"

[workspace.dependencies]
auto-lang = { path = "../../crates/auto-lang" }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
# Plan 413 §5.2:放宽到 "0.14" 让未来补丁版自动流入
iced = { version = "0.14", features = ["tokio", "advanced"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors"] }
