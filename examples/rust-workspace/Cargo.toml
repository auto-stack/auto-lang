[workspace]
members = [
    "011-calculator",
    "012-stopwatch",
    "013-todo",
    "014-weather",
    "015-notes",
    "015-notes-back",
    "016-calendar",
    # PLAN-590（Stage B P-5）：025-sys-monitor 随桌面域资产迁 auto-os/apps/——
    # 其 rust 后端产物经 P-2（PLAN-587）解析序落 app 仓内 rust-workspace/，
    # 共享工作区 member 项移除（此前 member 列表指陈旧 gen 残骸目录，全新
    # 检出无该目录即 workspace 装载红——潜伏断裂顺修）。
    "auto-musk-back",
    "contact-form",
    "converter",
    "counter",
    "hero-section",
    "login",
    "myapp-back",
    "pricing-table",
    "profile-card",
    "stats-board"
]
resolver = "2"

[workspace.dependencies]
auto-lang = { path = "../../crates/auto-lang" }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt"] }
# Plan 413 §5.2:放宽到 "0.14" 让未来补丁版自动流入
iced = { version = "0.14", features = ["tokio", "advanced"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
tower-http = { version = "0.5", features = ["cors"] }
