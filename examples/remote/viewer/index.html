<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Remote Viewer — Plan 508</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0d1220;
        color: #cbd5e1;
        font: 14px/1.5 system-ui, sans-serif;
      }
      h1 { font-size: 15px; font-weight: 600; color: #94a3b8; margin: 0; }
      #status { font-size: 12px; color: #64748b; min-height: 16px; }
      #status.err { color: #f87171; }
      canvas {
        background: #090e1a;
        border: 1px solid #1e293b;
        border-radius: 8px;
        width: 720px;
        height: 480px;
        image-rendering: pixelated;
      }
      #hint { font-size: 11px; color: #475569; }
    </style>
  </head>
  <body>
    <h1>Auto Remote Viewer（RenderQueue 远程镜像 · Plan 508）</h1>
    <div id="status">connecting…</div>
    <canvas id="view" width="480" height="320"></canvas>
    <div id="hint">点击画布内按钮 → InputMsg 回发宿主 → 新帧推送</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
