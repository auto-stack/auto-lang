[workspace]
members = [
    "crates/a2r-std",
    # Plan 430: rustdoc 元信息工具(离线,不入 auto-lang 依赖树)
    "crates/shim-metadata",
    # Plan 387 W5b: behavior-parity tests — transpile .at → compile+run → compare
    # stdout to the VM actor suite. Slow (cargo build per case), so #[ignore]d.
    "crates/a2r-actor-tests",
    "crates/auto",
    "crates/auto-atom",
    # Plan 768: AutoDown TestCase protocol core (dependency-light; adapters
    # live in auto-lang/src/test_cases and depend on this crate).
    "crates/auto-test-case",
    "crates/auto-gen",
    # PLAN-791: interpreter-free generation core (guard/output/error/report);
    # auto-gen stays the Auto executable-template adapter over it.
    "crates/auto-gen-core",
    # PLAN-811: media foundation crate (renderer-neutral image asset
    # pipeline data plane/runtime + local media file service), extracted
    # verbatim from auto-lang's ui/{image_pipeline,media_service};
    # auto-lang keeps thin re-export facades at the old paths. No
    # auto-lang/auto-man/auto-ui/auto-vm deps (closure pinned by
    # test/fixtures/modularity/media-core-consumer).
    "crates/auto-media-core",
    "crates/auto-lang",
    # PLAN-814: 纯语言 SDK——非 UI 语言栈单一来源（use_scanner 起步，
    # parser/compile/VM/trans 随 T-02..T-06 迁入）；normal/build/dev 闭包
    # 无 UI 实现/Man（闭包钉：test/fixtures/modularity/language-sdk-consumer）。
    "crates/auto-lang-core",
    # PLAN-814: UI 编译/生成域——aura 提取/design tokens/四生成器
    # （T-03 迁入）；依赖 SDK，不被 SDK 反向依赖。
    "crates/auto-ui-compiler",
    # PLAN-814: UI 运行/renderer/宿主域——VM 渲染轨与桌面栈（T-04 迁入）；
    # 依赖 SDK 与 UI compiler；宿主能力装配收敛于此。
    "crates/auto-ui-runtime",
    # PLAN-807: text foundation crate (persistent rope, file-backed paging,
    # snapshots, diff engine), extracted verbatim from auto-lang's
    # ui/code_editor; auto-lang keeps thin re-export facades at the old
    # paths. No auto-lang/auto-man/auto-ui/auto-vm deps (closure pinned by
    # test/fixtures/modularity/text-core-consumer).
    "crates/auto-text-core",
    # PLAN-801: dialect port API crate (light CompilerSession/Scenario +
    # ExternalDialect + object-safe ParseContext; depends only on
    # auto-ast/auto-lex/auto-diagnostics — no Parser/VM/UI/Man implementation
    # in its closure; external grammar impls depend on this crate only).
    "crates/auto-parser-api",
    # PLAN-806: UI msg/model 声明文法单一份实现 crate（完整算法自 Parser
    # 逐字迁出，经 dyn ParseContext 驱动；闭包仅 auto-parser-api 轻层，
    # 无 auto-lang/Parser/VM/renderer）。
    "crates/auto-ui-dialect",
    # PLAN-799: AST model crate (Code/Stmt/Expr/Type/UI-compat nodes +
    # ToNode/ToAtom/AtomWriter serialization; extracted verbatim from
    # auto-lang; no Parser/TypeStore/inference/VM/UI deps).
    "crates/auto-ast",
    # PLAN-789: lexical foundation crate (Token/Lexer single source,
    # extracted verbatim from auto-lang; no auto-lang/auto-man/UI deps).
    "crates/auto-lex",
    # PLAN-793: diagnostics foundation crate (AutoError aggregation +
    # syntax/type/name/runtime/comptime/warning families, extracted verbatim
    # from auto-lang; no AST/parser/VM/UI deps).
    "crates/auto-diagnostics",
    # PLAN-780: light static project-model for pac.at (pilot probe; depends
    # only on auto-atom/auto-val — no compiler/VM/UI types cross this boundary)
    "crates/auto-project-model",
    "crates/auto-macros",
    # Plan 078: AutoMan migration from ../auto-man
    "crates/auto-man",
    # PLAN-809: management/build-planning rules core — pac.at declaration
    # normalization, target/link closure, source selection and build planning
    # as pure rules over auto-val nodes; language execution, Git/FS
    # observation and Builder execution stay in auto-man adapters.
    "crates/auto-man-core",
    # PLAN-795: pac.lock core (model/TOML-JSON codec/verify rules), extracted
    # Target-free from auto-man; auto-man keeps the Target→projection, Git
    # observation and compatibility facade over this crate.
    "crates/auto-package-lock",
    # PLAN-800: resolved dependency view & module path resolution core,
    # extracted language-free from auto-man resolver.rs; auto-man keeps
    # ExecutionMode/pac.at scanning/ModuleResolver trait as the adapter.
    "crates/auto-package-resolver",
    # PLAN-803: Man template/builder asset single source + pure scaffold
    # path planning, extracted language-free from auto-man asset.rs
    # (rust-embed resources; auto-man keeps the Auto-eval/IO adapter).
    "crates/auto-man-assets",
    # PLAN-805: toolchain config model / flag mapping / command template
    # core, extracted verbatim from auto-man builder/ninja
    # (config.rs/mapper.rs/templates.rs); auto-man keeps the am.at loading,
    # PATH/disk/process resolution and Ninja execution as upper layers.
    "crates/auto-toolchain-core",
    # PLAN-816 T-02: unified owned subprocess execution facility (argv/cwd/env/
    # stdio policy/exit classification/deadline/cancel with owned reaping/
    # reader termination/child-tree exit). std-only closure; the scattered
    # spawn sites (main.rs run_command_live, pkg.rs run_script_live, git.rs,
    # http_service.rs serve_rust) migrate onto it in T-03/T-05/T-06.
    "crates/auto-tool-execution",
    # PLAN-816 T-12 (M816-A): real I-TOOL client — spawns actual tool host
    # processes through auto-tool-execution and speaks the auto-tool-protocol
    # single-source framing (describe/validate_project, version/capability
    # rejections as data, per-request deadline with owned-tree reaping and
    # reader joins). Closure = protocol/project-model (data) + execution
    # (man-ecosystem); no tool-host static linking, no discovery (T-04).
    "crates/auto-tool-client",
    # PLAN-808: terminal host-domain core (owned cell/color/geometry contract,
    # runtime autoterm_core.dll engine service + 34-method terminal capability
    # port); auto-lang keeps the VM codec, UI view/input adapter and assembly.
    "crates/auto-terminal-core",
    "crates/auto-lsp",
    "crates/auto-val",
    # PLAN-036 T-02: shell pack a2r 生成物（无窗组件库——入库=真编译门）
    "crates/shell-pack",
    "crates/auto-vm",
    # Plan 330: auto-shell + ash-core moved to separate repo (../auto-shell)
    # "crates/auto-shell",
    # "crates/ash-core",
    # Plan 325: AI crates moved to separate auto-ai repo (../auto-ai)
    # "crates/auto-xml",  # Temporarily disabled due to Cargo.toml issues
    # Plan 082: AutoCache global build cache
    "crates/auto-cache",
    # Plan 202: Auto Playground
    "crates/auto-playground",
    # Plan 216: C FFI Bindgen
    "crates/auto-bindgen",
    # Plan 365 W2–W4: COSMIC replication — ports, demo, libcosmic host, Linux adapters.
    # W3/W4 use cfg(target_os) so they compile on all platforms (Windows falls
    # back to mock/headless stubs; Linux compiles real zbus/libcosmic code).
    "crates/auto-cosmic/ports",
    "crates/auto-cosmic/demo",
    "crates/auto-cosmic/host-libcosmic",
    "crates/auto-cosmic/ports-linux",
    # Plan 509 route B: Smithay compositor host (Linux-gated smithay dep;
    # non-Linux compiles a cfg stub — Windows dev flow unaffected).
    "crates/auto-cosmic/host-smithay",
    # PLAN-815 T-03: I-TOOL light tool protocol (version/capability/budget/
    # error/framing over stdio; pure data — reuses the one-source
    # auto-project-model request + wire codec, no AST/VM/renderer/Man).
    "crates/auto-tool-protocol",
    # PLAN-815 T-12: UI engineering tool package (lib + `auto-ui-tool` bin).
    # M815-A scope: describe/validate_project host over the light protocol;
    # generation/build/run closure lands with M815-B. No Man/legacy big-lib
    # deps (closure pinned by test/fixtures/modularity/ui-tool-consumer).
    "crates/auto-ui-tools",
    # PLAN-815 T-04: API generation core — single-algorithm api_gen +
    # rust_sidecar effect adapter + shared rust workspace layout, extracted
    # from auto-man (owner: lang-service-adapter; man/ui域双消费).
    "crates/auto-api-gen",
    # "crates/xdm-gen",  # Temporarily disabled: broken dependency paths + gitignored
]
