    # cargo test --manifest-path test/fixtures/modularity/ast-model-consumer/Cargo.toml
    "test/fixtures/modularity/ast-model-consumer",
    # PLAN-789: 外部词法消费方探针——独立 fixture crate（唯一依赖
    # auto-lex，证明词法基础无 auto-lang/auto-man/UI 依赖），门禁经
    # cargo test --manifest-path test/fixtures/modularity/lex-consumer/Cargo.toml
    "test/fixtures/modularity/lex-consumer",
    # PLAN-790: 外部 clipboard media provider 消费方探针——独立 fixture
    # crate（无 UI feature 构建，证明 files/image 剪贴板 2934..2937 core
    # 供值链在 crate 边界外真实工作），门禁经
    # cargo test --manifest-path test/fixtures/modularity/clipboard-media-provider-consumer/Cargo.toml
    "test/fixtures/modularity/clipboard-media-provider-consumer",
    # PLAN-791: 外部生成核心消费方探针——独立 fixture crate（仅依赖
    # auto-gen-core，证明纯生成核心无解释器/无 auto-lang 闭包可用），
    # 门禁经
    # cargo test --manifest-path test/fixtures/modularity/gen-core-consumer/Cargo.toml
    # 依赖闭包断言：bash test/fixtures/modularity/gen-core-consumer/verify-deps.sh
    "test/fixtures/modularity/gen-core-consumer",
    # PLAN-807: 外部文本基础消费方探针——独立 fixture crate（唯一依赖
