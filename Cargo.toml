    # cargo test --manifest-path test/fixtures/modularity/text-core-consumer/Cargo.toml
    # 依赖闭包断言：bash test/fixtures/modularity/text-core-consumer/verify-deps.sh
    "test/fixtures/modularity/text-core-consumer",
    # PLAN-811: 外部媒体基础消费方探针——独立 fixture crate（唯一依赖
