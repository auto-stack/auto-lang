# PLAN-777：v0.6 模块边界基线配置（scripts/modularity-audit.py 读取）
#
# 依据：docs/plans/reports/v06-modularization-research.md（2026-10-13 调研）、
# docs/design/37-v06-modularization-and-repo-boundaries.md（目标态，不得当成已达成事实）、
# docs/plans/777-v06-modular-boundary-baseline.md。
#
# 纪律：
# - 观察模式（observe）覆盖全仓；strict 只判冻结基线之外的新增禁向声明边。
# - 存量禁向边必须逐边 [[baseline.edge_notes]]（owner + exit_phase）方可 grandfather；
#   status="revoked" 的边再现即判红。
# - [baseline] 不允许任何目录级/前缀级豁免键（宽豁免在配置加载时即被拒绝）。
# - 域分类是声明性映射；无法精确分类的成员留在 "unclassified"，不伪造归属。

schema = "module-boundaries/1"

# ---------------------------------------------------------------------------
# 包名 → 模块域（Design 37 §2 五域；当前单仓内的诚实分类）
#
# 本表按**包名**映射：workspace 成员之外，还登记已知根外实现包（777 r2 复审 F01）——
# 现存独立仓 ../auto-ui、../auto-man（调研 §10 已核查）。规则按包名查域；未登记的
# 外置包保持真实 unclassified（不假称所有外部依赖违规，也不漏判已声明要限制的实现包）。
# ---------------------------------------------------------------------------
[domains.members]
# 根外已知实现包（Design 37 §2：语言域禁依赖 auto-ui/auto-man；本表映射使
# 域限定跨根规则能命中按包名出现的根外目标）。
"auto-ui" = "ui"
# 语言巨 crate：core+UI 五目录混居（已知债；终态拆分 R4/R8，见 ownership 焊点表）。
# 不把它写成纯 lang-core——文本层候选单独观察（text_scan.core_to_ui）。
"auto-lang" = "lang-monolith"
# 数据域（Atom/Value 基础表示）——Design 37：数据域只依赖更低层。
"auto-atom" = "data"
"auto-val" = "data"
# 语言核心域（Design 37 §2"语言"行的已拆出部分）——PLAN-789 首个成员
# auto-lex（Token/Lexer/词法错误单一来源，自 auto-lang 逐字抽取交付）；
# PLAN-793 增 auto-diagnostics（AutoError 聚合 + 各族诊断单一来源，
# 自 auto-lang 逐字抽取，无 AST/parser/VM/UI 依赖）。
# 与 lang-monolith 的关系：单向 lang-monolith → lang-core（抽取方向）；
# lang-core 禁反向依赖 lang-monolith/man/工具/UI。
"auto-lex" = "lang-core"
"auto-diagnostics" = "lang-core"
# PLAN-799：AST 模型 crate（Code/Stmt/Expr/Type/UI 兼容节点 + ToNode/
# ToAtom/AtomWriter，自 auto-lang 逐字抽取；依赖闭包 = auto-val/auto-lex/
# serde，闭包由 test/fixtures/modularity/ast-model-consumer 钉住）。
"auto-ast" = "lang-core"
# PLAN-801：方言端口 API crate（轻 CompilerSession/Scenario +
# ExternalDialect + 对象安全 ParseContext + 快照凭据）；依赖闭包 =
# auto-ast/auto-lex/auto-diagnostics（闭包由 test/fixtures/modularity/
# dialect-api-consumer 钉住），auto-lang 单向依赖之实现端口——外部文法
# 实现脱离语言实现包（方言接口依赖倒置）。
"auto-parser-api" = "lang-core"
# PLAN-806：UI msg/model 声明文法单一份实现 crate（完整算法自 auto-lang
# Parser 迁出，经 dyn ParseContext 端口驱动）；依赖闭包 = auto-parser-api
#（闭包由 test/fixtures/modularity/ui-declarations-consumer 钉住），
# auto-lang 单向依赖之——UI 声明文法脱离语言实现包。
"auto-ui-dialect" = "lang-core"
# PLAN-807：文本基础 crate（持久化 rope/文件后援分页/快照/diff 引擎，
# 自 auto-lang ui/code_editor 逐字抽取；依赖闭包 = imara-diff+std，闭包由
# test/fixtures/modularity/text-core-consumer 钉住）。auto-lang 单向依赖之
# （抽取方向 lang-monolith→lang-core）；适用 lang-core 禁向族。
"auto-text-core" = "lang-core"
# PLAN-811：媒体基础 crate（renderer-neutral 图像资产管线 + 本地媒体文件
# 服务，自 auto-lang ui/{image_pipeline,media_service} 逐字抽取；依赖闭包 =
# image/exif/blake3/fastrand/thiserror，闭包由 test/fixtures/modularity/
# media-core-consumer 钉住）。auto-lang/auto-man 单向依赖之（抽取方向
# lang-monolith→lang-core）；适用 lang-core 禁向族。
"auto-media-core" = "lang-core"# 语言工具基建（被 auto-lang 消费的底层 util/生成/测试基建）。
"auto-cache" = "lang-infra"
"shim-metadata" = "lang-infra"
"auto-bindgen" = "lang-infra"
"auto-test-case" = "lang-infra"
"auto-macros" = "lang-infra"
# 标准运行时/宿主能力（a2r-std）。
"a2r-std" = "runtime"
# PLAN-808：terminal 宿主域核心——owned cell/color/geometry 合同 + 运行期
# autoterm_core.dll 服务 + 34 方法 TerminalHostProvider 端口；闭包仅
# std+libloading（由 terminal-core-consumer/verify-deps.sh 钉住），禁依赖
# lang-monolith/lang-infra/man/tool/UI（runtime-no-compiler-ui-man 规则）。
"auto-terminal-core" = "runtime"
# 测试域。
"a2r-actor-tests" = "test"
# 工程工具域：man 核心 / man 生态（模板生成）。
"auto-man" = "man"
"auto-gen" = "man-ecosystem"
# PLAN-791：无解释器生成核心（guard/输出编排/错误/报告）——man 生态的
# 纯生成层，auto-gen（Auto 可执行模板 adapter）之下；禁依赖 auto-lang
# （闭包由 test/fixtures/modularity/gen-core-consumer 钉住）。
"auto-gen-core" = "man-ecosystem"
# PLAN-795：pac.lock 模型/codec/校验核心——man 生态的纯锁层，
# auto-man（Target/Git adapter + 兼容门面）之下；禁依赖 auto-lang
# （闭包由 test/fixtures/modularity/package-lock-consumer 钉住）。
"auto-package-lock" = "man-ecosystem"
# PLAN-800：已解析依赖视图/包路径候选/依赖内模块判定核心——man 生态的
# 纯解析层，auto-man（ExecutionMode/pac.at 扫描/ModuleResolver trait
# adapter）之下；std-only、禁依赖 auto-lang/auto-val
# （闭包由 test/fixtures/modularity/package-resolver-consumer 钉住）。
"auto-package-resolver" = "man-ecosystem"
# PLAN-803：Man 模板/构建器资源单一来源 + 纯脚手架路径规划——man
# 生态的纯资源层，auto-man（asset.rs Auto 求值/IO adapter）之下；
# rust-embed+std、禁依赖 auto-lang/auto-man/auto-val
# （闭包由 test/fixtures/modularity/man-assets-consumer 钉住）。
"auto-man-assets" = "man-ecosystem"
# PLAN-805：工具链配置模型/flag 映射/四命令模板单一来源——man 生态的
# 纯规则层，auto-man（am.at 加载/PATH 磁盘进程观测/Ninja 执行 adapter）
# 之下；auto-val+std、禁依赖 auto-lang/auto-man/auto-gen/auto-vm/UI
# （闭包由 test/fixtures/modularity/toolchain-core-consumer 钉住）。
"auto-toolchain-core" = "man-ecosystem"
# PLAN-809: 管理规则核心（声明归一/闭包/选择/规划纯规则；闭包恒轻）
"auto-man-core" = "man-ecosystem"
# 顶层装配/工具/CLI（允许依赖任意下层域）。
"auto" = "cli"
"auto-lsp" = "tool"
"auto-playground" = "tool"
"auto-vm" = "tool"            # ~207 行辅助 CLI；命名债见调研 §7.1
"shell-pack" = "host-tool"
"auto-cosmic-ports" = "tool"   # cosmic 实验性移植/宿主（demo/host 依赖 lang 属顶层方向）
"auto-cosmic-demo" = "tool"
"auto-cosmic-host-libcosmic" = "tool"
"auto-cosmic-ports-linux" = "tool"
"auto-cosmic-host-smithay" = "tool"

# ---------------------------------------------------------------------------
# 禁向规则（只约束 normal/build 非 optional 声明边；dev 依赖与 optional 边默认放行，
# 由具体规则显式收紧）。依据 Design 37 §2“禁止反向依赖”列 + §6 路径/发行规则。
# ---------------------------------------------------------------------------
[[rules.forbidden_declared]]
id = "data-stays-bottom"
from_domains = ["data"]
to_domains = ["lang-monolith", "lang-infra", "runtime", "man", "man-ecosystem", "ui", "tool", "cli", "host-tool"]
kinds = ["normal", "build"]

[[rules.forbidden_declared]]
id = "runtime-no-compiler-ui-man"
from_domains = ["runtime"]
to_domains = ["lang-monolith", "lang-infra", "man", "man-ecosystem", "tool", "cli", "host-tool"]
kinds = ["normal", "build"]

[[rules.forbidden_declared]]
id = "lang-infra-no-upward"
from_domains = ["lang-infra"]
to_domains = ["lang-monolith", "man", "man-ecosystem", "runtime", "tool", "cli", "host-tool"]
kinds = ["normal", "build"]

# PLAN-789：语言核心域（已拆出的 lang-core 成员）禁向——不得反向依赖
# 巨 crate（lang-monolith）、man/工具/UI/host，也不得引运行时（词法层
# 纯内存）。数据域（auto-val/auto-atom）与 lang-infra 为其合法下层。
[[rules.forbidden_declared]]
id = "lang-core-no-monolith-no-man-no-tools"
from_domains = ["lang-core"]
to_domains = ["lang-monolith", "man", "man-ecosystem", "runtime", "ui", "tool", "cli", "host-tool"]
kinds = ["normal", "build"]

[[rules.forbidden_declared]]
id = "lang-no-man-no-tools"
from_domains = ["lang-monolith"]
to_domains = ["man", "man-ecosystem", "tool", "cli", "host-tool"]
kinds = ["normal", "build"]

[[rules.forbidden_declared]]
id = "man-core-no-lang-monolith"
from_domains = ["man"]
to_domains = ["lang-monolith"]
kinds = ["normal", "build"]

[[rules.forbidden_declared]]
id = "man-ecosystem-no-lang-monolith"
from_domains = ["man-ecosystem"]
to_domains = ["lang-monolith"]
kinds = ["normal", "build"]

[[rules.forbidden_declared]]
id = "ui-no-man-big-lib"
from_domains = ["ui"]
to_domains = ["man"]
kinds = ["normal", "build"]

# 语言域禁止反向依赖外置 UI/Man 实现（Design 37 §2“语言”行：禁 auto-ui/auto-man/
# 桌面应用）。只约束指向外部 ui/man 域的跨根 normal/build 边；跨根依赖本身不要求
# optional——开发期显式 path、发行期版本/revision 锁定是 Design 37 §6 的既定规则，
# “必须 optional”没有设计依据（777 r1 复审 F06 裁定）。
[[rules.forbidden_declared]]
id = "out-of-root-edges-must-be-optional"
from_domains = ["lang-monolith", "lang-core", "lang-infra", "runtime"]
to_domains = ["ui", "man", "man-ecosystem"]
to_scopes = ["external"]
kinds = ["normal", "build"]

# ---------------------------------------------------------------------------
# 文本候选扫描（观察层；候选不是语义边；盲区见 scanner_limitations）
# 口径与调研报告 §2/§4.3 对齐，计数可跨基线比较。
# ---------------------------------------------------------------------------
[[text_scan]]
id = "core_to_ui"
description = "语言 core（非 UI 五目录）对 UI 模块的文本引用候选：crate::ui / crate::ui_gen / crate::aura / crate::design_tokens / crate::a2ui 及 auto_lang:: 同名前缀"
source_roots = ["crates/auto-lang/src"]
exclude_roots = [
    "crates/auto-lang/src/ui",
    "crates/auto-lang/src/ui_gen",
    "crates/auto-lang/src/aura",
    "crates/auto-lang/src/design_tokens",
    "crates/auto-lang/src/a2ui",
]
patterns = [
    "\\bcrate::ui\\b", "\\bcrate::ui_gen\\b", "\\bcrate::aura\\b",
    "\\bcrate::design_tokens\\b", "\\bcrate::a2ui\\b",
    "\\bauto_lang::ui\\b", "\\bauto_lang::ui_gen\\b", "\\bauto_lang::aura\\b",
    "\\bauto_lang::design_tokens\\b", "\\bauto_lang::a2ui\\b",
]

[[text_scan]]
id = "ui_to_language"
description = "UI 五目录对语言实现的文本引用候选——观察范围仅 auto_lang:: 前缀；crate::ast/vm/parser 等核心路径不在本扫描范围（明确声明的范围边界，非完整架构依赖图）"
source_roots = [
    "crates/auto-lang/src/ui",
    "crates/auto-lang/src/ui_gen",
    "crates/auto-lang/src/aura",
    "crates/auto-lang/src/design_tokens",
    "crates/auto-lang/src/a2ui",
]
patterns = ["\\bauto_lang::"]

[[text_scan]]
id = "man_to_language"
description = "auto-man 源码对语言实现的文本引用候选（auto_lang:: 前缀）"
source_roots = ["crates/auto-man/src"]
patterns = ["\\bauto_lang::"]

