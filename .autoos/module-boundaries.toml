# ---------------------------------------------------------------------------
# 基线（生成物为 .autoos/module-boundaries-baseline.json；--refresh-baseline 刷新）
# ---------------------------------------------------------------------------
[baseline]
# 只允许窄豁免：[[baseline.edge_notes]] 逐边 owner + 退出阶段（status=active|revoked）。
# 禁止目录级/前缀级豁免键——宽豁免会在配置加载时被拒绝。
path = ".autoos/module-boundaries-baseline.json"

# 存量禁向边（对上面规则的现行违例）——冻结于基线、带退出 owner：
[[baseline.edge_notes]]
from = "auto-man"
to = "auto-lang"
kind = "normal"
owner = "man-core"
exit_phase = "R5"
status = "active"
note = "man→完整语言栈（含 VM）；调研 §5.1/Design 37 §5——包管理核心与语言/服务构建 adapter 分层后退出"

[[baseline.edge_notes]]
from = "auto-gen"
to = "auto-lang"
kind = "normal"
owner = "man-ecosystem"
exit_phase = "R5"
status = "active"
note = "模板引擎拉入完整编译器；调研 §5.2——纯模板核心与可执行模板 adapter 分层后退出"

# 非禁向但需治理登记的跨根边（optional，合规；供发行/路径规则 R6 追踪）：
[[baseline.edge_notes]]
from = "auto-lang"
to = "autodown-core"
kind = "normal"
owner = "lang-build"
exit_phase = "R6"
status = "active"
note = "跨仓 optional path 依赖（../auto-down）；组内解析序 + 发行版本锁定规则（Design 37 §6）"
